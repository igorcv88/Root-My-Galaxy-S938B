version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep Gradle updates isolated. Android Gradle Plugin, Kotlin/Compose and
    # runtime libraries have different compatibility constraints; one
    # incompatible toolchain update must not block unrelated dependency fixes.
