name: Validate observer PID pruning v2

on:
  push:
    branches:
      - fix/czg3-observer-process-coverage

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/czg3-observer-process-coverage
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prune exited tracked PIDs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/cpp/external_observer.c')
          s = p.read_text()

          old = '#define OBS_MAX_SEEN_PIDS 96'
          assert s.count(old) == 1, f'seen define matches={s.count(old)}'
          s = s.replace(old, '#define OBS_MAX_SEEN_PIDS 256', 1)

          anchor = 'static pid_t parse_marker_pid_after(const char *line, const char *token) {'
          assert s.count(anchor) == 1, f'anchor matches={s.count(anchor)}'
          forget = '''static void observer_forget_tracked_pid(pid_t pid) {
            if (pid <= 0) return;
            pthread_mutex_lock(&observer_pid_mutex);
            for (size_t i = 0; i < observer_tracked_pid_count; ++i) {
              if (observer_tracked_pids[i].pid != pid) continue;
              if (i + 1 < observer_tracked_pid_count) {
                memmove(&observer_tracked_pids[i], &observer_tracked_pids[i + 1],
                        (observer_tracked_pid_count - i - 1) * sizeof(observer_tracked_pids[0]));
              }
              observer_tracked_pid_count--;
              memset(&observer_tracked_pids[observer_tracked_pid_count], 0,
                     sizeof(observer_tracked_pids[0]));
              break;
            }
            pthread_mutex_unlock(&observer_pid_mutex);
          }

          '''
          s = s.replace(anchor, forget + anchor, 1)

          needle = '''      }
              continue;
            }
            if (!pid_seen(pids[i])) sample_process_metadata(pids[i], now_ms);'''
          replacement = '''      }
              if (pids[i] != root) observer_forget_tracked_pid(pids[i]);
              continue;
            }
            if (!pid_seen(pids[i])) sample_process_metadata(pids[i], now_ms);'''
          assert s.count(needle) == 1, f'failure-tail matches={s.count(needle)}'
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PreleaseVersionCode=10039 -PreleaseVersionName=0.3.39
      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/external_observer.c
          git diff --cached --check
          git commit -m 'Prune exited observer PIDs'
          git push origin HEAD:fix/czg3-observer-process-coverage
