name: Validate observer review fixes

on:
  push:
    branches:
      - fix/czg3-observer-process-coverage

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/czg3-observer-process-coverage
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply process identity and role coverage fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_between(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          c_path = Path('app/src/main/cpp/external_observer.c')
          c = c_path.read_text()

          old_globals = '''static pid_t observer_seen_pids[OBS_MAX_SEEN_PIDS];
          static size_t observer_seen_pid_count;
          struct observer_tracked_pid {
            pid_t pid;
            char role[OBS_ROLE_CAPACITY];
          };
          '''
          new_globals = '''struct observer_process_identity {
            pid_t pid;
            unsigned long long starttime_ticks;
          };
          static struct observer_process_identity observer_seen_identities[OBS_MAX_SEEN_PIDS];
          static size_t observer_seen_identity_count;
          struct observer_tracked_pid {
            pid_t pid;
            unsigned long long starttime_ticks;
            uint64_t discovered_ms;
            char role[OBS_ROLE_CAPACITY];
          };
          '''
          if old_globals not in c:
              raise SystemExit('observer globals anchor missing')
          c = c.replace(old_globals, new_globals, 1)

          identity_block = textwrap.dedent(r'''
          static int read_proc_starttime(pid_t pid, unsigned long long *starttime_ticks) {
            if (pid <= 0 || !starttime_ticks) return 0;
            char path[128], text[4096];
            snprintf(path, sizeof(path), "/proc/%d/stat", pid);
            if (read_text(path, text, sizeof(text)) <= 0) return 0;
            char *rparen = strrchr(text, ')');
            if (!rparen) return 0;
            char *p = rparen + 2;
            if (!*p) return 0;
            p += 2;
            int field = 4;
            while (*p && field <= 22) {
              while (*p == ' ') p++;
              if (!*p) break;
              char *token_end = p;
              while (*token_end && *token_end != ' ') token_end++;
              if (field == 22) {
                errno = 0;
                char *parsed_end = NULL;
                unsigned long long value = strtoull(p, &parsed_end, 10);
                if (errno != 0 || parsed_end != token_end || value == 0) return 0;
                *starttime_ticks = value;
                return 1;
              }
              p = token_end;
              field++;
            }
            return 0;
          }

          static int identity_seen(pid_t pid, unsigned long long starttime_ticks) {
            if (pid <= 0 || starttime_ticks == 0) return 0;
            for (size_t i = 0; i < observer_seen_identity_count; ++i) {
              if (observer_seen_identities[i].pid == pid &&
                  observer_seen_identities[i].starttime_ticks == starttime_ticks)
                return 1;
            }
            if (observer_seen_identity_count < OBS_MAX_SEEN_PIDS) {
              observer_seen_identities[observer_seen_identity_count].pid = pid;
              observer_seen_identities[observer_seen_identity_count].starttime_ticks = starttime_ticks;
              observer_seen_identity_count++;
            }
            return 0;
          }

          static void observer_track_pid(pid_t pid, const char *role, uint64_t now_ms) {
            if (pid <= 0 || !role || !*role) return;
            unsigned long long starttime_ticks = 0;
            int identity_ok = read_proc_starttime(pid, &starttime_ticks);
            if (!identity_ok) {
              observer_append("RMG_OBSERVER_V2|event=pid_discovered|t_ms=%llu|role=%s|pid=%d|starttime_ticks=NA|identity_ok=0|source=marker\n",
                  (unsigned long long)now_ms, role, pid);
              return;
            }

            pthread_mutex_lock(&observer_pid_mutex);
            for (size_t i = 0; i < observer_tracked_pid_count; ++i) {
              if (observer_tracked_pids[i].pid == pid &&
                  observer_tracked_pids[i].starttime_ticks == starttime_ticks &&
                  strcmp(observer_tracked_pids[i].role, role) == 0) {
                pthread_mutex_unlock(&observer_pid_mutex);
                return;
              }
            }
            for (size_t i = 0; i < observer_tracked_pid_count; ++i) {
              if (observer_tracked_pids[i].pid != pid) continue;
              if (observer_tracked_pids[i].starttime_ticks == starttime_ticks) continue;
              observer_tracked_pids[i].starttime_ticks = starttime_ticks;
              observer_tracked_pids[i].discovered_ms = now_ms;
              snprintf(observer_tracked_pids[i].role,
                       sizeof(observer_tracked_pids[i].role), "%s", role);
              pthread_mutex_unlock(&observer_pid_mutex);
              observer_append("RMG_OBSERVER_V2|event=pid_discovered|t_ms=%llu|role=%s|pid=%d|starttime_ticks=%llu|identity_ok=1|source=marker\n",
                  (unsigned long long)now_ms, role, pid, starttime_ticks);
              return;
            }
            if (observer_tracked_pid_count < OBS_MAX_TRACKED_PIDS) {
              struct observer_tracked_pid *slot =
                  &observer_tracked_pids[observer_tracked_pid_count++];
              slot->pid = pid;
              slot->starttime_ticks = starttime_ticks;
              slot->discovered_ms = now_ms;
              snprintf(slot->role, sizeof(slot->role), "%s", role);
            }
            pthread_mutex_unlock(&observer_pid_mutex);
            observer_append("RMG_OBSERVER_V2|event=pid_discovered|t_ms=%llu|role=%s|pid=%d|starttime_ticks=%llu|identity_ok=1|source=marker\n",
                (unsigned long long)now_ms, role, pid, starttime_ticks);
          }

          static size_t observer_snapshot_tracked(struct observer_tracked_pid *out,
                                                  size_t capacity) {
            if (!out || capacity == 0) return 0;
            pthread_mutex_lock(&observer_pid_mutex);
            size_t count = observer_tracked_pid_count;
            if (count > capacity) count = capacity;
            memcpy(out, observer_tracked_pids, count * sizeof(*out));
            pthread_mutex_unlock(&observer_pid_mutex);
            return count;
          }

          static void observer_forget_tracked_identity(pid_t pid,
                                                       unsigned long long starttime_ticks) {
            if (pid <= 0 || starttime_ticks == 0) return;
            pthread_mutex_lock(&observer_pid_mutex);
            for (size_t i = 0; i < observer_tracked_pid_count;) {
              if (observer_tracked_pids[i].pid != pid ||
                  observer_tracked_pids[i].starttime_ticks != starttime_ticks) {
                i++;
                continue;
              }
              if (i + 1 < observer_tracked_pid_count) {
                memmove(&observer_tracked_pids[i], &observer_tracked_pids[i + 1],
                        (observer_tracked_pid_count - i - 1) * sizeof(observer_tracked_pids[0]));
              }
              observer_tracked_pid_count--;
              memset(&observer_tracked_pids[observer_tracked_pid_count], 0,
                     sizeof(observer_tracked_pids[0]));
            }
            pthread_mutex_unlock(&observer_pid_mutex);
          }

          ''').lstrip()
          c = replace_between(
              c,
              'static int pid_seen(pid_t pid) {',
              'static pid_t parse_marker_pid_after',
              identity_block,
          )

          proc_block = textwrap.dedent(r'''
          struct proc_sample {
            pid_t ppid;
            char state;
            unsigned long long utime, stime, starttime_ticks;
            long threads, processor;
            unsigned long long runtime_ns, wait_ns, slices;
            int schedstat_ok, processor_ok;
            char comm[48];
          };

          static int parse_proc_stat(pid_t pid, struct proc_sample *sample) {
            char path[128], text[4096];
            sample->processor = -1;
            sample->processor_ok = 0;
            sample->starttime_ticks = 0;
            snprintf(path, sizeof(path), "/proc/%d/stat", pid);
            if (read_text(path, text, sizeof(text)) <= 0) return 0;
            char *lparen = strchr(text, '('), *rparen = strrchr(text, ')');
            if (!lparen || !rparen || rparen <= lparen) return 0;
            size_t comm_len = (size_t)(rparen - lparen - 1);
            if (comm_len >= sizeof(sample->comm)) comm_len = sizeof(sample->comm) - 1;
            memcpy(sample->comm, lparen + 1, comm_len); sample->comm[comm_len] = '\0';
            sanitize_inline(sample->comm);
            char *p = rparen + 2;
            if (!*p) return 0;
            sample->state = *p;
            p += 2;
            int field = 4;
            while (*p && field <= 39) {
              while (*p == ' ') p++;
              if (!*p) break;
              char *token_end = p;
              while (*token_end && *token_end != ' ') token_end++;
              char *parsed_end = NULL;
              errno = 0;
              if (field == 4 || field == 20 || field == 39) {
                long long value = strtoll(p, &parsed_end, 10);
                int parsed = errno == 0 && parsed_end == token_end;
                if (!parsed && field <= 20) return 0;
                if (parsed && field == 4) sample->ppid = (pid_t)value;
                if (parsed && field == 20) sample->threads = (long)value;
                if (parsed && field == 39) {
                  sample->processor = (long)value;
                  sample->processor_ok = value >= 0;
                }
              } else if (field == 14 || field == 15 || field == 22) {
                unsigned long long value = strtoull(p, &parsed_end, 10);
                if (errno != 0 || parsed_end != token_end) return 0;
                if (field == 14) sample->utime = value;
                else if (field == 15) sample->stime = value;
                else sample->starttime_ticks = value;
              }
              p = token_end;
              field++;
            }
            if (sample->starttime_ticks == 0) return 0;
            snprintf(path, sizeof(path), "/proc/%d/schedstat", pid);
            char schedstat[256];
            if (read_text(path, schedstat, sizeof(schedstat)) > 0 &&
                sscanf(schedstat, "%llu %llu %llu", &sample->runtime_ns, &sample->wait_ns, &sample->slices) == 3)
              sample->schedstat_ok = 1;
            return field > 22;
          }

          ''').lstrip()
          c = replace_between(c, 'struct proc_sample {', 'static int pid_in_list', proc_block)

          tree_block = textwrap.dedent(r'''
          static const char *tracked_role_for_identity(
              pid_t pid, unsigned long long starttime_ticks,
              const struct observer_tracked_pid *tracked, size_t tracked_count) {
            for (size_t i = 0; i < tracked_count; ++i) {
              if (tracked[i].pid == pid && tracked[i].starttime_ticks == starttime_ticks)
                return tracked[i].role;
            }
            return "tree";
          }

          static int snapshot_identity_is_current(
              pid_t pid, const struct observer_tracked_pid *tracked, size_t tracked_count) {
            unsigned long long current = 0;
            if (!read_proc_starttime(pid, &current)) return 0;
            for (size_t i = 0; i < tracked_count; ++i) {
              if (tracked[i].pid == pid && tracked[i].starttime_ticks == current) return 1;
            }
            return 0;
          }

          static int snapshot_has_tracked_pid(
              pid_t pid, const struct observer_tracked_pid *tracked, size_t tracked_count) {
            for (size_t i = 0; i < tracked_count; ++i) if (tracked[i].pid == pid) return 1;
            return 0;
          }

          static void forget_snapshot_identities_for_pid(
              pid_t pid, const struct observer_tracked_pid *tracked, size_t tracked_count,
              unsigned long long keep_starttime) {
            for (size_t i = 0; i < tracked_count; ++i) {
              if (tracked[i].pid != pid || tracked[i].starttime_ticks == keep_starttime) continue;
              observer_forget_tracked_identity(pid, tracked[i].starttime_ticks);
            }
          }

          static size_t collect_observed_processes(
              pid_t root, pid_t *pids, size_t capacity,
              const struct observer_tracked_pid *tracked, size_t tracked_count) {
            if (capacity == 0) return 0;
            size_t count = 0;
            if (root > 0 && snapshot_identity_is_current(root, tracked, tracked_count))
              pids[count++] = root;
            for (size_t i = 0; i < tracked_count && count < capacity; ++i) {
              if (tracked[i].pid <= 0 || pid_in_list(pids, count, tracked[i].pid)) continue;
              unsigned long long current = 0;
              if (!read_proc_starttime(tracked[i].pid, &current) ||
                  current != tracked[i].starttime_ticks)
                continue;
              pids[count++] = tracked[i].pid;
            }
            for (size_t index = 0; index < count && count < capacity; ++index) {
              if (snapshot_has_tracked_pid(pids[index], tracked, tracked_count) &&
                  !snapshot_identity_is_current(pids[index], tracked, tracked_count))
                continue;
              collect_thread_children(pids[index], pids, &count, capacity);
            }
            return count;
          }

          static void sample_process_tree(pid_t root, uint64_t now_ms) {
            struct observer_tracked_pid tracked[OBS_MAX_TRACKED_PIDS];
            size_t tracked_count = observer_snapshot_tracked(tracked, OBS_MAX_TRACKED_PIDS);
            pid_t pids[OBS_MAX_PIDS];
            size_t count = collect_observed_processes(
                root, pids, OBS_MAX_PIDS, tracked, tracked_count);
            observer_append("RMG_OBSERVER_V2|event=tree|t_ms=%llu|root=%d|count=%zu|tracked=%zu\n",
                            (unsigned long long)now_ms, root, count, tracked_count);
            for (size_t i = 0; i < count; ++i) {
              struct proc_sample sample; memset(&sample, 0, sizeof(sample));
              if (!parse_proc_stat(pids[i], &sample)) {
                observer_append("RMG_OBSERVER_V2|event=proc_unavailable|t_ms=%llu|pid=%d|role=unknown\n",
                    (unsigned long long)now_ms, pids[i]);
                forget_snapshot_identities_for_pid(pids[i], tracked, tracked_count, 0);
                continue;
              }
              forget_snapshot_identities_for_pid(
                  pids[i], tracked, tracked_count, sample.starttime_ticks);
              const char *role = tracked_role_for_identity(
                  pids[i], sample.starttime_ticks, tracked, tracked_count);
              if (!identity_seen(pids[i], sample.starttime_ticks))
                sample_process_metadata(pids[i], now_ms);
              char cpu[24], runtime[40], wait[40], slices[40];
              if (sample.processor_ok) snprintf(cpu, sizeof(cpu), "%ld", sample.processor);
              else snprintf(cpu, sizeof(cpu), "NA");
              format_u64(runtime, sizeof(runtime), sample.schedstat_ok, sample.runtime_ns);
              format_u64(wait, sizeof(wait), sample.schedstat_ok, sample.wait_ns);
              format_u64(slices, sizeof(slices), sample.schedstat_ok, sample.slices);
              observer_append("RMG_OBSERVER_V2|event=proc|t_ms=%llu|pid=%d|starttime_ticks=%llu|ppid=%d|comm=%s|state=%c|cpu=%s|threads=%ld|utime=%llu|stime=%llu|runtime_ns=%s|wait_ns=%s|slices=%s|role=%s\n",
                  (unsigned long long)now_ms, pids[i], sample.starttime_ticks,
                  sample.ppid, sample.comm, sample.state ? sample.state : '?', cpu,
                  sample.threads, sample.utime, sample.stime, runtime, wait, slices, role);
            }
          }

          ''').lstrip()
          c = replace_between(c, 'static const char *tracked_role_for_pid', 'static void probe_capabilities', tree_block)

          old_reset = "observer_seen_pid_count=0;pthread_mutex_lock(&observer_pid_mutex);"
          new_reset = "observer_seen_identity_count=0;memset(observer_seen_identities,0,sizeof(observer_seen_identities));pthread_mutex_lock(&observer_pid_mutex);"
          if old_reset not in c:
              raise SystemExit('observer reset anchor missing')
          c = c.replace(old_reset, new_reset, 1)

          c_path.write_text(c)

          k_path = Path('app/src/main/java/dev/busung/s25uroot/Czg3ExternalTelemetry.kt')
          k = k_path.read_text()
          parser = textwrap.dedent(r'''
          internal object Czg3ExternalTelemetryParser {
              private val attempt = Regex("""\bexploit attempt=(\d+)/(\d+)\b""")
              private val observerStart = Regex("""RMG_OBSERVER_V2\|event=start\|t_ms=(\d+)""")
              private val observerStop = Regex("""RMG_OBSERVER_V2\|event=stop\|t_ms=(\d+)\|dropped=(\d+)""")
              private val nativeAttach = Regex("""RMG_OBSERVER_V2\|event=attach\|t_ms=(\d+)\|pid=(\d+)\|stat_access=(\d+)""")
              private val controllerScope = Regex("""RMG_OBSERVER_V2\|event=controller_start\|[^\n]*\|scope=([^|\n]+)""")
              private val marker = Regex("""RMG_OBSERVER_V2\|event=marker\|t_ms=(\d+)\|name=([a-z0-9_]+)\|""")
              private val discovered = Regex("""RMG_OBSERVER_V2\|event=pid_discovered\|t_ms=(\d+)\|role=([a-z_]+)\|pid=(\d+)\|starttime_ticks=([^|\n]+)\|identity_ok=(\d+)""")
              private val rawSlidePid = Regex("""slide child context[^\n]*\bpid=(\d+)""")
              private val procLine = Regex("""RMG_OBSERVER_V2\|event=proc\|([^\n]+)""")
              private val pselect = Regex("""slide pselect returned[^\n]*elapsed_usec=(\d+)""")
              private val fopsConsume = Regex("""app fops slide route[^\n]*effective_consume_usec=(\d+)""")
              private val fopsTrigger = Regex("""app fops stage=trigger-return[^\n]*triggered=(\d+)""")
              private val roles = listOf("helper", "supervisor", "attempt", "slide_child")

              fun parse(log: String): Czg3ExternalRunSummary {
                  val maxAttempt = attempt.findAll(log)
                      .mapNotNull { it.groupValues[1].toIntOrNull() }
                      .maxOrNull() ?: 0
                  val start = observerStart.find(log)?.groupValues?.get(1)?.toLongOrNull()
                  val stopMatch = observerStop.findAll(log).lastOrNull()
                  val stop = stopMatch?.groupValues?.get(1)?.toLongOrNull()
                  val dropped = stopMatch?.groupValues?.get(2)?.toLongOrNull()
                  val scope = controllerScope.findAll(log).lastOrNull()?.groupValues?.get(1)

                  val native = nativeAttach.findAll(log).lastOrNull()
                  val targetPid = native?.groupValues?.get(2)?.toLongOrNull()
                  val attached = native?.groupValues?.get(3) == "1"

                  val markers = marker.findAll(log).mapNotNull { match ->
                      val time = match.groupValues[1].toLongOrNull() ?: return@mapNotNull null
                      time to match.groupValues[2]
                  }.toList()

                  val discoveries = discovered.findAll(log).mapNotNull { match ->
                      val time = match.groupValues[1].toLongOrNull() ?: return@mapNotNull null
                      val role = match.groupValues[2]
                      val pid = match.groupValues[3].toLongOrNull() ?: return@mapNotNull null
                      val identityOk = match.groupValues[5] == "1"
                      val starttime = match.groupValues[4].toLongOrNull()?.takeIf { identityOk && it > 0L }
                      DiscoveredProcess(role, pid, starttime, time)
                  }.toList()
                  val expectedByRole = roles.associateWith { role ->
                      discoveries.filter { it.role == role && it.starttimeTicks != null }
                  }

                  val procSamples = procLine.findAll(log).mapNotNull { match ->
                      val fields = parseFields(match.groupValues[1])
                      val pid = fields["pid"]?.toLongOrNull() ?: return@mapNotNull null
                      val explicitRole = fields["role"]?.takeIf { it in roles }
                      val role = explicitRole ?: if (scope != "process_tree_system" && pid == targetPid) "helper" else "tree"
                      ProcessSample(
                          timeMillis = fields["t_ms"]?.toLongOrNull() ?: 0L,
                          pid = pid,
                          starttimeTicks = fields["starttime_ticks"]?.toLongOrNull(),
                          role = role,
                          cpu = fields["cpu"]?.toIntOrNull()?.takeIf { it >= 0 },
                          runtimeNanos = fields["runtime_ns"]?.toLongOrNull(),
                          waitNanos = fields["wait_ns"]?.toLongOrNull(),
                          slices = fields["slices"]?.toLongOrNull(),
                      )
                  }.toList()

                  fun isCovered(expected: DiscoveredProcess): Boolean {
                      val starttime = expected.starttimeTicks ?: return false
                      return procSamples.any { sample ->
                          sample.role == expected.role &&
                              sample.pid == expected.pid &&
                              sample.starttimeTicks == starttime &&
                              sample.timeMillis >= expected.discoveredMillis
                      }
                  }

                  val roleMetrics = roles.associateWith { role ->
                      buildRoleMetrics(role, expectedByRole.getValue(role), procSamples)
                  }
                  val helperMetrics = roleMetrics.getValue("helper")
                  val criticalSlide = expectedByRole.getValue("slide_child").maxByOrNull(DiscoveredProcess::discoveredMillis)
                  val slideObserved = rawSlidePid.containsMatchIn(log) ||
                      discoveries.any { it.role == "slide_child" } ||
                      markers.any { it.second == "slide_child" }

                  val coverageProblems = mutableListOf<String>()
                  if (scope == "process_tree_system") {
                      if (!attached) coverageProblems += "helper_attach"
                      fun requireRole(role: String, required: Boolean) {
                          if (!required) return
                          val all = discoveries.filter { it.role == role }
                          if (all.isEmpty()) {
                              coverageProblems += "${role}_discovery"
                              return
                          }
                          if (all.any { it.starttimeTicks == null }) coverageProblems += "${role}_identity"
                          val verified = all.filter { it.starttimeTicks != null }
                          if (verified.isEmpty() || verified.any { !isCovered(it) })
                              coverageProblems += "${role}_sample"
                      }
                      requireRole("helper", true)
                      requireRole("supervisor", true)
                      requireRole("attempt", true)
                      requireRole("slide_child", slideObserved)
                  }
                  val processCoverage = when (scope) {
                      "process_tree_system" -> coverageProblems.isEmpty()
                      "system_remote_markers" -> null
                      else -> null
                  }
                  val coverageReason = when {
                      scope == "system_remote_markers" -> "not_applicable_remote_markers"
                      scope != "process_tree_system" -> "scope_unknown"
                      coverageProblems.isEmpty() -> "complete"
                      else -> coverageProblems.distinct().joinToString(",")
                  }
                  val sessionComplete = stop != null && dropped == 0L
                  val traceComplete = when (scope) {
                      "process_tree_system" -> sessionComplete && processCoverage == true
                      "system_remote_markers" -> sessionComplete && markers.isNotEmpty()
                      else -> sessionComplete && attached
                  }

                  val p0Success = log.contains("slide-kaslr-ok") || markers.any { it.second == "p0_success" }
                  val fopsReached = log.contains("durable log checkpoint stage=fops-page-held") ||
                      log.contains("app fops slide route") ||
                      markers.any { it.second == "fops_page_held" || it.second == "fops_route" }
                  val trigger = fopsTrigger.findAll(log).lastOrNull()
                      ?.groupValues?.get(1)?.toIntOrNull()?.let { it != 0 }
                  val unsafe = log.contains("writer route outcome is mutation-uncertain", ignoreCase = true) ||
                      markers.any { it.second == "unsafe_stop" }

                  val checkpoint = when {
                      fopsReached -> "fops/page-held"
                      p0Success -> "p0/slide-kaslr-ok"
                      log.contains("p0 pipe oracle prepared") -> "p0/oracle-ready"
                      else -> null
                  }
                  val checkpointTime = when (checkpoint) {
                      "fops/page-held" -> markers.lastOrNull { it.second == "fops_page_held" || it.second == "fops_route" }?.first
                      "p0/slide-kaslr-ok" -> markers.lastOrNull { it.second == "p0_success" }?.first
                      "p0/oracle-ready" -> markers.lastOrNull { it.second == "p0_oracle_ready" }?.first
                      else -> null
                  }

                  return Czg3ExternalRunSummary(
                      maxSupervisorAttempt = maxAttempt,
                      observerStartUptimeMillis = start,
                      observerStopUptimeMillis = stop,
                      exploitElapsedMillis = if (start != null && stop != null && stop >= start) stop - start else null,
                      observerTargetPid = targetPid,
                      observerAttached = attached,
                      observerScope = scope,
                      observerDroppedEvents = dropped,
                      processSamples = procSamples.size,
                      traceComplete = traceComplete,
                      processCoverageComplete = processCoverage,
                      processCoverageReason = coverageReason,
                      criticalSlidePid = criticalSlide?.pid,
                      roleMetrics = roleMetrics,
                      p0Succeeded = p0Success,
                      fopsReached = fopsReached,
                      fopsTriggered = trigger,
                      unsafeStop = unsafe,
                      lastCheckpoint = checkpoint,
                      lastCheckpointUptimeMillis = checkpointTime,
                      lastPselectDurationMicros = pselect.findAll(log).lastOrNull()?.groupValues?.get(1)?.toLongOrNull(),
                      fopsEffectiveConsumeMicros = fopsConsume.findAll(log).lastOrNull()?.groupValues?.get(1)?.toLongOrNull(),
                      targetCpuChangesObserved = helperMetrics.cpuChangesObserved,
                      targetRuntimeDeltaNanos = helperMetrics.runtimeDeltaNanos,
                      targetWaitDeltaNanos = helperMetrics.waitDeltaNanos,
                      targetSlicesDelta = helperMetrics.slicesDelta,
                  )
              }

              private fun parseFields(body: String): Map<String, String> = body
                  .split('|')
                  .mapNotNull { field ->
                      val separator = field.indexOf('=')
                      if (separator <= 0) null else field.substring(0, separator) to field.substring(separator + 1)
                  }
                  .toMap()

              private fun buildRoleMetrics(
                  role: String,
                  expected: List<DiscoveredProcess>,
                  allSamples: List<ProcessSample>,
              ): Czg3ProcessRoleMetrics {
                  val samples = allSamples.filter { it.role == role }.sortedBy(ProcessSample::timeMillis)
                  val byIdentity = samples.groupBy { it.pid to (it.starttimeTicks ?: -1L) }
                  val sampledIdentities = samples.map { it.pid to (it.starttimeTicks ?: -1L) }.toSet()
                  var cpuSeen = false
                  var cpuChanges = 0
                  byIdentity.values.forEach { identitySamples ->
                      val cpus = identitySamples.mapNotNull(ProcessSample::cpu)
                      if (cpus.isNotEmpty()) cpuSeen = true
                      cpuChanges += cpus.zipWithNext().count { (a, b) -> a != b }
                  }

                  fun sumDelta(selector: (ProcessSample) -> Long?): Long? {
                      var any = false
                      var total = 0L
                      byIdentity.values.forEach { identitySamples ->
                          val values = identitySamples.mapNotNull(selector)
                          val first = values.firstOrNull()
                          val last = values.lastOrNull()
                          if (first != null && last != null && last >= first) {
                              total += last - first
                              any = true
                          }
                      }
                      return total.takeIf { any }
                  }

                  return Czg3ProcessRoleMetrics(
                      expectedPids = expected.map { it.pid to it.starttimeTicks }.toSet().size,
                      sampledPids = sampledIdentities.size,
                      processSamples = samples.size,
                      cpuChangesObserved = cpuChanges.takeIf { cpuSeen },
                      runtimeDeltaNanos = sumDelta(ProcessSample::runtimeNanos),
                      waitDeltaNanos = sumDelta(ProcessSample::waitNanos),
                      slicesDelta = sumDelta(ProcessSample::slices),
                  )
              }

              private data class DiscoveredProcess(
                  val role: String,
                  val pid: Long,
                  val starttimeTicks: Long?,
                  val discoveredMillis: Long,
              )

              private data class ProcessSample(
                  val timeMillis: Long,
                  val pid: Long,
                  val starttimeTicks: Long?,
                  val role: String,
                  val cpu: Int?,
                  val runtimeNanos: Long?,
                  val waitNanos: Long?,
                  val slices: Long?,
              )
          }

