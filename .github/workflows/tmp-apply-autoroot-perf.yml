name: Apply Auto Root performance fixes

on:
  push:
    branches:
      - fix/autoroot-standalone-scheduling-load
    paths:
      - .github/workflows/tmp-apply-autoroot-perf.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/autoroot-standalone-scheduling-load
          fetch-depth: 0

      - name: Apply source fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # History: never reparse all observer logs on the UI thread, recover
          # interrupted runs without loading every full history record, and
          # prune by file metadata rather than decoding every log at each save.
          path = "app/src/main/java/dev/busung/s25uroot/InstallHistory.kt"
          replace_once(path,
              "    val normalized = entries.map(::normalizeCzg3ExternalHistory)\n",
              "    val normalized = entries\n")
          replace_once(path,
              '''    fun closeInterruptedRuns(currentBootId: String? = AutoRootSupport.currentBootToken()): List<InstallHistoryEntry> = load().map { entry ->\n        val recovered = recoverInterruptedEntry(entry, currentBootId, System.currentTimeMillis())\n        if (recovered.result == InstallRunResult.UnexpectedReboot) {\n            val record = PstoreCollector.collect(recovered.usedShizuku)\n            recovered.copy(crashRecordStatus = record.status, crashRecord = record.content).also(::save)\n        } else if (recovered != entry) recovered.also(::save) else entry\n    }\n''',
              '''    fun closeInterruptedRuns(currentBootId: String? = AutoRootSupport.currentBootToken()): List<InstallHistoryEntry> {\n        recoverInterruptedRuns(currentBootId)\n        return load()\n    }\n\n    fun recoverInterruptedRuns(currentBootId: String? = AutoRootSupport.currentBootToken()) {\n        val completedAtMillis = System.currentTimeMillis()\n        directory.listFiles { file -> file.extension == "json" }.orEmpty()\n            .filter(::mightContainRunningEntry)\n            .mapNotNull(::decodeOrQuarantine)\n            .filter { it.result == InstallRunResult.Running }\n            .forEach { entry ->\n                val recovered = recoverInterruptedEntry(entry, currentBootId, completedAtMillis)\n                val completed = if (recovered.result == InstallRunResult.UnexpectedReboot) {\n                    val record = PstoreCollector.collect(recovered.usedShizuku)\n                    recovered.copy(crashRecordStatus = record.status, crashRecord = record.content)\n                } else {\n                    recovered\n                }\n                save(completed)\n            }\n    }\n''')
          replace_once(path,
              '''    @Synchronized\n    fun save(entry: InstallHistoryEntry) {\n        val normalized = normalizeCzg3ExternalHistory(entry)\n        val atomicFile = AtomicFile(File(directory, "${normalized.id}.json"))\n        val output = atomicFile.startWrite()\n        try {\n            output.write(encode(normalized).toString().toByteArray(Charsets.UTF_8)); output.flush(); output.fd.sync(); atomicFile.finishWrite(output)\n            val files = directory.listFiles { file -> file.extension == "json" }.orEmpty()\n            val entries = files.mapNotNull(::decodeOrQuarantine)\n            val pruneIds = historyIdsToPrune(entries, MAX_HISTORY_ENTRIES)\n            files.filter { it.nameWithoutExtension in pruneIds }.forEach(File::delete)\n        } catch (error: Throwable) { atomicFile.failWrite(output); throw error }\n    }\n''',
              '''    @Synchronized\n    fun save(entry: InstallHistoryEntry) {\n        val normalized = normalizeCzg3ExternalHistory(entry)\n        val target = File(directory, "${normalized.id}.json")\n        val isNewEntry = !target.exists()\n        val atomicFile = AtomicFile(target)\n        val output = atomicFile.startWrite()\n        try {\n            output.write(encode(normalized).toString().toByteArray(Charsets.UTF_8)); output.flush(); output.fd.sync(); atomicFile.finishWrite(output)\n            if (isNewEntry) pruneHistoryFiles()\n        } catch (error: Throwable) { atomicFile.failWrite(output); throw error }\n    }\n''')
          replace_once(path,
              '''    fun delete(id: String) { File(directory, "$id.json").delete() }\n\n    private fun encode(entry: InstallHistoryEntry) = JSONObject()\n''',
              '''    fun delete(id: String) { File(directory, "$id.json").delete() }\n\n    private fun mightContainRunningEntry(file: File): Boolean = runCatching {\n        file.inputStream().bufferedReader(Charsets.UTF_8).use { reader ->\n            val buffer = CharArray(RUNNING_ENTRY_SCAN_CHARS)\n            val count = reader.read(buffer)\n            count > 0 && String(buffer, 0, count).contains("\\\"result\\\":\\\"Running\\\"")\n        }\n    }.getOrDefault(false)\n\n    private fun pruneHistoryFiles() {\n        val files = directory.listFiles { file -> file.extension == "json" }.orEmpty()\n        if (files.size <= MAX_HISTORY_ENTRIES) return\n        files.sortedWith(\n            compareByDescending<File> { it.lastModified() }\n                .thenByDescending(File::getName),\n        ).drop(MAX_HISTORY_ENTRIES).forEach(File::delete)\n    }\n\n    private fun encode(entry: InstallHistoryEntry) = JSONObject()\n''')
          replace_once(path,
              '''        internal const val MAX_HISTORY_ENTRIES = 50\n        private const val MAX_STAGE_TIMINGS = 128\n''',
              '''        internal const val MAX_HISTORY_ENTRIES = 50\n        private const val MAX_STAGE_TIMINGS = 128\n        private const val RUNNING_ENTRY_SCAN_CHARS = 2_048\n''')

          # ViewModel: no filesystem/history parsing on Main. Initial recovery and
          # every refresh run on IO; deletes are also moved off the UI thread.
          path = "app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt"
          replace_once(path,
              "    private val mutableHistory = MutableStateFlow(historyStore.closeInterruptedRuns())\n",
              "    private val mutableHistory = MutableStateFlow<List<InstallHistoryEntry>>(emptyList())\n")
          replace_once(path,
              "    private var discoveryJob: Job? = null\n    private var installJob: Job? = null\n",
              "    private var discoveryJob: Job? = null\n    private var historyJob: Job? = null\n    private var installJob: Job? = null\n")
          replace_once(path,
              '''    init {\n        refresh()\n    }\n\n    fun refresh() {\n        if (installJob?.isActive == true) return\n        mutableHistory.value = historyStore.load()\n        discoveryJob?.cancel()\n''',
              '''    init {\n        refreshInternal(recoverInterrupted = true)\n    }\n\n    fun refresh() = refreshInternal(recoverInterrupted = false)\n\n    private fun refreshInternal(recoverInterrupted: Boolean) {\n        if (installJob?.isActive == true) return\n        historyJob?.cancel()\n        historyJob = viewModelScope.launch(Dispatchers.IO) {\n            mutableHistory.value = if (recoverInterrupted) {\n                historyStore.closeInterruptedRuns()\n            } else {\n                historyStore.load()\n            }\n        }\n        discoveryJob?.cancel()\n''')
          replace_once(path,
              '''        if (toDelete.isEmpty()) return\n        toDelete.forEach(historyStore::delete)\n        mutableHistory.value = mutableHistory.value.filterNot { it.id in toDelete }\n''',
              '''        if (toDelete.isEmpty()) return\n        mutableHistory.value = mutableHistory.value.filterNot { it.id in toDelete }\n        viewModelScope.launch(Dispatchers.IO) {\n            toDelete.forEach(historyStore::delete)\n        }\n''')

          # Auto Root is standalone-only by invariant. Never probe or depend on
          # Shizuku during boot. CZG3 spawns while the FGS scheduling context is
          # fresh and leaves the selected uptime gate to the payload itself.
          path = "app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt"
          replace_once(path,
              '''        val requestShizukuRunning = ShizukuController.isRunning()\n        val requestShizukuGranted = ShizukuController.isGranted()\n        if (useShizuku) {\n            require(ShizukuController.isRunning() && ShizukuController.isGranted()) {\n                context.getString(R.string.error_shizuku_unavailable)\n            }\n        }\n''',
              '''        require(!useShizuku) { "Auto Root is standalone-only" }\n        val requestShizukuRunning = false\n        val requestShizukuGranted = false\n''')
          replace_once(path,
              '''        val launchWindow = ExploitRunControl.waitForLaunchWindow(\n            requestedAtUptimeMillis,\n            minimumUptimeSeconds,\n        )\n''',
              '''        val launchWindow = if (externalObserverMode) {\n            ExploitRunControl.releaseImmediatelyForPayloadGate(requestedAtUptimeMillis)\n        } else {\n            ExploitRunControl.waitForLaunchWindow(\n                requestedAtUptimeMillis,\n                minimumUptimeSeconds,\n            )\n        }\n''')
          replace_once(path,
              '''                ShizukuController.isRunning(),\n                ShizukuController.isGranted(),\n                transport,\n''',
              '''                false,\n                false,\n                transport,\n''')

          path = "app/src/main/java/dev/busung/s25uroot/AutoRootService.kt"
          replace_once(path,
              "        historyStore.closeInterruptedRuns()\n",
              "        historyStore.recoverInterruptedRuns()\n")
          replace_once(path,
              '''            // Upstream #483 avoids Shizuku at boot entirely. Preserve the faster\n            // Shizuku path when it is actually usable, but verify more than Binder\n            // presence before spending the single automatic attempt for this boot.\n            val shizukuCandidate = ShizukuController.isRunning() && ShizukuController.isGranted()\n            val useShizuku = shizukuCandidate && ShizukuController.canRunUnattended()\n            val shizukuHealthCompletedAt = SystemClock.elapsedRealtime()\n''',
              '''            // Auto Root is intentionally standalone-only. Shizuku is a manual\n            // transport and can still be racing its own post-boot initialization.\n            val useShizuku = false\n''')
          replace_once(path,
              '''            persist(AndroidRunContext.snapshot(this, "shizuku_health_complete", shizukuHealthCompletedAt), force = true)\n            persist(\n                "[*] payload_mode=${if (BuildConfig.CZG3_DIAGNOSTIC_PAYLOAD) "diagnostic" else "production"} " +\n                    "sha256=${payloads.profile.exploit.sha256} size=${payloads.profile.exploit.size}",\n                force = true,\n            )\n            if (shizukuCandidate && !useShizuku) {\n                persist("[*] Shizuku available but unattended health probe failed; falling back to standalone")\n            }\n            persist("[*] Auto Root starting transport=${if (useShizuku) "shizuku" else "standalone"}")\n''',
              '''            persist(\n                "[*] payload_mode=${if (BuildConfig.CZG3_DIAGNOSTIC_PAYLOAD) "diagnostic" else "production"} " +\n                    "sha256=${payloads.profile.exploit.sha256} size=${payloads.profile.exploit.size}",\n                force = true,\n            )\n            persist("[*] Auto Root transport policy=standalone")\n            persist("[*] Auto Root starting transport=standalone")\n''')

          # Request Doze/battery-optimization exemption when Auto Root is enabled.
          path = "app/src/main/AndroidManifest.xml"
          replace_once(path,
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n')

          path = "app/src/main/java/dev/busung/s25uroot/InstallActivity.kt"
          replace_once(path,
              '''import android.Manifest\nimport android.content.pm.PackageManager\nimport android.os.Build\nimport android.os.Bundle\n''',
              '''import android.Manifest\nimport android.content.Intent\nimport android.content.pm.PackageManager\nimport android.net.Uri\nimport android.os.Build\nimport android.os.Bundle\nimport android.os.PowerManager\nimport android.provider.Settings\n''')
          replace_once(path, "import androidx.compose.animation.AnimatedContent\n", "")
          replace_once(path, "import androidx.compose.animation.animateContentSize\n", "")
          replace_once(path, "import androidx.compose.material3.LinearProgressIndicator\n", "")
          replace_once(path, "import androidx.compose.material3.LoadingIndicator\n", "")
          replace_once(path, "import kotlinx.coroutines.delay\n", "")
          replace_once(path,
              '''                val notificationPermissionLauncher = rememberLauncherForActivityResult(\n                    ActivityResultContracts.RequestPermission(),\n                ) { granted ->\n                    if (granted) {\n                        AppPreferences.setAutoRootEnabled(this@InstallActivity, true)\n                        autoRootEnabled = true\n                    } else {\n                        AppPreferences.setAutoRootEnabled(this@InstallActivity, false)\n                        autoRootEnabled = false\n                        Toast.makeText(\n                            this@InstallActivity,\n                            getString(R.string.autoroot_notification_permission),\n                            Toast.LENGTH_LONG,\n                        ).show()\n                    }\n                }\n                val setAutoRoot: (Boolean) -> Unit = { enabled ->\n                    if (!enabled) {\n                        AppPreferences.setAutoRootEnabled(this@InstallActivity, false)\n                        autoRootEnabled = false\n                    } else if (!AutoRootSupport.hasVerifiedInstall(this@InstallActivity)) {\n                        Toast.makeText(\n                            this@InstallActivity,\n                            getString(R.string.autoroot_prior_install_required),\n                            Toast.LENGTH_LONG,\n                        ).show()\n                    } else if (\n                        ContextCompat.checkSelfPermission(\n                            this@InstallActivity,\n                            Manifest.permission.POST_NOTIFICATIONS,\n                        ) == PackageManager.PERMISSION_GRANTED\n                    ) {\n                        AppPreferences.setAutoRootEnabled(this@InstallActivity, true)\n                        autoRootEnabled = true\n                    } else {\n                        notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n                    }\n                }\n''',
              '''                val batteryOptimizationLauncher = rememberLauncherForActivityResult(\n                    ActivityResultContracts.StartActivityForResult(),\n                ) {\n                    val exempt = getSystemService(PowerManager::class.java)\n                        .isIgnoringBatteryOptimizations(packageName)\n                    AppPreferences.setAutoRootEnabled(this@InstallActivity, exempt)\n                    autoRootEnabled = exempt\n                    if (!exempt) {\n                        Toast.makeText(\n                            this@InstallActivity,\n                            getString(R.string.autoroot_battery_optimization_required),\n                            Toast.LENGTH_LONG,\n                        ).show()\n                    }\n                }\n                val requestBatteryOptimizationExemption: () -> Unit = {\n                    val powerManager = getSystemService(PowerManager::class.java)\n                    if (powerManager.isIgnoringBatteryOptimizations(packageName)) {\n                        AppPreferences.setAutoRootEnabled(this@InstallActivity, true)\n                        autoRootEnabled = true\n                    } else {\n                        val packageUri = Uri.parse("package:$packageName")\n                        runCatching {\n                            batteryOptimizationLauncher.launch(\n                                Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, packageUri),\n                            )\n                        }.onFailure {\n                            batteryOptimizationLauncher.launch(\n                                Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS),\n                            )\n                        }\n                    }\n                }\n                val notificationPermissionLauncher = rememberLauncherForActivityResult(\n                    ActivityResultContracts.RequestPermission(),\n                ) { granted ->\n                    if (granted) {\n                        requestBatteryOptimizationExemption()\n                    } else {\n                        AppPreferences.setAutoRootEnabled(this@InstallActivity, false)\n                        autoRootEnabled = false\n                        Toast.makeText(\n                            this@InstallActivity,\n                            getString(R.string.autoroot_notification_permission),\n                            Toast.LENGTH_LONG,\n                        ).show()\n                    }\n                }\n                val setAutoRoot: (Boolean) -> Unit = { enabled ->\n                    if (!enabled) {\n                        AppPreferences.setAutoRootEnabled(this@InstallActivity, false)\n                        autoRootEnabled = false\n                    } else if (!AutoRootSupport.hasVerifiedInstall(this@InstallActivity)) {\n                        Toast.makeText(\n                            this@InstallActivity,\n                            getString(R.string.autoroot_prior_install_required),\n                            Toast.LENGTH_LONG,\n                        ).show()\n                    } else if (\n                        ContextCompat.checkSelfPermission(\n                            this@InstallActivity,\n                            Manifest.permission.POST_NOTIFICATIONS,\n                        ) == PackageManager.PERMISSION_GRANTED\n                    ) {\n                        requestBatteryOptimizationExemption()\n                    } else {\n                        notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n                    }\n                }\n''')
          replace_once(path,
              '''    val logScrollState = rememberScrollState()\n    val view = LocalView.current\n    LaunchedEffect(installState.log) {\n        delay(40)\n        logScrollState.scrollTo(logScrollState.maxValue)\n    }\n''',
              '''    val view = LocalView.current\n''')
          replace_once(path,
              '''            InstallerLog(\n                output = installState.log,\n                modifier = Modifier.weight(1f),\n                scrollState = logScrollState,\n            )\n''',
              '''            InstallerLog(\n                output = installState.log,\n                modifier = Modifier.weight(1f),\n            )\n''')
          replace_once(path,
              '''        modifier = Modifier\n            .fillMaxWidth()\n            .animateContentSize(),\n''',
              '''        modifier = Modifier.fillMaxWidth(),\n''')
          replace_once(path,
              '''                AnimatedContent(targetState = installState.phase, label = "install-status-icon") { phase ->\n                    when {\n                        installState.busy -> LoadingIndicator(\n                            modifier = Modifier.size(44.dp),\n                            color = MaterialTheme.colorScheme.onPrimaryContainer,\n                        )\n                        phase == InstallPhase.Installed -> Icon(\n                            Icons.Rounded.Check,\n                            contentDescription = null,\n                            modifier = Modifier.size(44.dp),\n                        )\n                        else -> Icon(\n                            Icons.Rounded.Error,\n                            contentDescription = null,\n                            modifier = Modifier.size(44.dp),\n                        )\n                    }\n                }\n''',
              '''                when {\n                    installState.busy -> Icon(\n                        Icons.Rounded.Memory,\n                        contentDescription = null,\n                        modifier = Modifier.size(44.dp),\n                    )\n                    installState.phase == InstallPhase.Installed -> Icon(\n                        Icons.Rounded.Check,\n                        contentDescription = null,\n                        modifier = Modifier.size(44.dp),\n                    )\n                    else -> Icon(\n                        Icons.Rounded.Error,\n                        contentDescription = null,\n                        modifier = Modifier.size(44.dp),\n                    )\n                }\n''')
          replace_once(path,
              '''            if (installState.busy) {\n                LinearProgressIndicator(\n                    modifier = Modifier.fillMaxWidth(),\n                    color = LocalContentColor.current,\n                    trackColor = LocalContentColor.current.copy(alpha = 0.2f),\n                )\n            }\n''',
              '''''')
          replace_once(path,
              '''                    if (stepState == 1 && phase !in setOf(InstallPhase.Failed, InstallPhase.Ready)) {\n                        LoadingIndicator(\n                            modifier = Modifier.size(24.dp),\n                            color = MaterialTheme.colorScheme.onSurface,\n                        )\n                    }\n''',
              '''''')
          replace_once(path,
              '''private fun InstallerLog(\n    output: String,\n    modifier: Modifier,\n    scrollState: androidx.compose.foundation.ScrollState,\n) {\n''',
              '''private fun InstallerLog(\n    output: String,\n    modifier: Modifier,\n) {\n    val scrollState = rememberScrollState()\n    val visibleOutput = remember(output) { installerLogForDisplay(output) }\n''')
          replace_once(path,
              '''                text = output.ifBlank { stringResource(R.string.install_preparing) },\n''',
              '''                text = visibleOutput.ifBlank { stringResource(R.string.install_preparing) },\n''')
          replace_once(path,
              '''@Composable\nprivate fun installPhaseDetail(phase: InstallPhase): String = stringResource(\n''',
              '''internal const val INSTALLER_LOG_RENDER_CHARS = 32_768\n\ninternal fun installerLogForDisplay(\n    output: String,\n    maxChars: Int = INSTALLER_LOG_RENDER_CHARS,\n): String {\n    require(maxChars > 0)\n    if (output.length <= maxChars) return output\n    return "…\\n" + output.takeLast(maxChars)\n}\n\n@Composable\nprivate fun installPhaseDetail(phase: InstallPhase): String = stringResource(\n''')

          # Default resource; locale-specific files fall back to this string.
          path = "app/src/main/res/values/strings.xml"
          p = Path(path)
          text = p.read_text()
          marker = "</resources>"
          addition = '    <string name="autoroot_battery_optimization_required">Disable battery optimization for Root My Galaxy to enable Auto Root.</string>\n'
          if 'name="autoroot_battery_optimization_required"' not in text:
              if marker not in text:
                  raise SystemExit("strings.xml missing resources end")
              p.write_text(text.replace(marker, addition + marker, 1))

          # Regression tests for payload-side gate and bounded live-log rendering.
          path = "app/src/test/java/dev/busung/s25uroot/ExploitRunControlTest.kt"
          replace_once(path,
              '''    private fun request(mode: InvocationMode) = ExploitEnvironmentRequest(\n''',
              '''    @Test\n    fun autoRootPayloadGateReleasesHelperImmediately() {\n        val window = ExploitRunControl.releaseImmediatelyForPayloadGate(\n            requestedAtUptimeMillis = 60_000L,\n            now = { 60_123L },\n        )\n        assertEquals(60_000L, window.requestedAtUptimeMillis)\n        assertEquals(60_123L, window.releasedAtUptimeMillis)\n        assertEquals(0L, window.actualWaitMillis)\n        assertFalse(window.waited)\n    }\n\n    private fun request(mode: InvocationMode) = ExploitEnvironmentRequest(\n''')

          Path("app/src/test/java/dev/busung/s25uroot/InstallerLogRenderingTest.kt").write_text('''package dev.busung.s25uroot\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass InstallerLogRenderingTest {\n    @Test\n    fun shortLogIsUnchanged() {\n        assertEquals("abc", installerLogForDisplay("abc", 8))\n    }\n\n    @Test\n    fun longLogKeepsOnlyBoundedTailForUi() {\n        val raw = "0123456789abcdef"\n        val visible = installerLogForDisplay(raw, 8)\n        assertTrue(visible.startsWith("…\\n"))\n        assertTrue(visible.endsWith("89abcdef"))\n        assertEquals(10, visible.length)\n    }\n}\n''')
          PY

      - name: Assert performance and transport invariants
        run: |
          set -euo pipefail
          grep -F 'val useShizuku = false' app/src/main/java/dev/busung/s25uroot/AutoRootService.kt
          grep -F 'require(!useShizuku)' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          grep -F 'releaseImmediatelyForPayloadGate' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          grep -F 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' app/src/main/AndroidManifest.xml
          grep -F 'MutableStateFlow<List<InstallHistoryEntry>>(emptyList())' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          ! grep -F 'MutableStateFlow(historyStore.closeInterruptedRuns())' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          ! grep -F 'val normalized = entries.map(::normalizeCzg3ExternalHistory)' app/src/main/java/dev/busung/s25uroot/InstallHistory.kt
          ! grep -F 'files.mapNotNull(::decodeOrQuarantine)' app/src/main/java/dev/busung/s25uroot/InstallHistory.kt
          ! grep -F 'LoadingIndicator' app/src/main/java/dev/busung/s25uroot/InstallActivity.kt
          ! grep -F 'AnimatedContent' app/src/main/java/dev/busung/s25uroot/InstallActivity.kt

      - name: Prepare Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test lint and assemble
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            -PreleaseVersionCode=10041 \
            -PreleaseVersionName=0.3.41

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'Igor'
          git config user.email 'igorv88@gmail.com'
          git add app/src/main app/src/test
          git commit -m 'Fix Auto Root scheduling and eliminate UI history ANRs'
          git push origin HEAD:fix/autoroot-standalone-scheduling-load

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-apply-autoroot-perf.yml
          git commit -m 'Remove temporary validation workflow [skip actions]'
          git push origin HEAD:fix/autoroot-standalone-scheduling-load
