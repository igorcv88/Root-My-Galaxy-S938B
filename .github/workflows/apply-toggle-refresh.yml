name: Apply immediate ReZygisk toggle refresh

on:
  push:
    branches:
      - agent/rezygisk-late-load
    paths:
      - .github/apply-toggle-refresh

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rezygisk-late-load
          fetch-depth: 0
      - name: Refresh installed state when toggle changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/dev/busung/s25uroot/MainActivity.kt')
          text = path.read_text()
          old = '''                    onReZygiskModeChanged = { enabled ->
                              AppPreferences.setReZygiskMode(this, enabled)
                              reZygiskMode = enabled
                          },'''
          new = '''                    onReZygiskModeChanged = { enabled ->
                              AppPreferences.setReZygiskMode(this, enabled)
                              reZygiskMode = enabled
                              installViewModel.refresh()
                          },'''
          if old not in text:
              raise SystemExit('target callback not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm -f .github/apply-toggle-refresh .github/workflows/apply-toggle-refresh.yml
      - name: Commit source change and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/busung/s25uroot/MainActivity.kt
          git commit -m "Refresh ReZygisk state when the toggle changes"
          git push origin HEAD:agent/rezygisk-late-load
