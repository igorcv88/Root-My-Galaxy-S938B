name: Validate PR33 Codex review fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-pr33-codex-review.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply Codex review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {old!r}, found {text.count(old)}")
              write(path, text.replace(old, new, 1))

          def insert_before(path, marker, block):
              text = read(path)
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: marker {marker!r} count={text.count(marker)}")
              write(path, text.replace(marker, block + marker, 1))

          def replace_region(path, start_marker, end_marker, block):
              text = read(path)
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{path}: start marker not found: {start_marker!r}")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f"{path}: end marker not found: {end_marker!r}")
              write(path, text[:start] + block + text[end:])

          # 1. Auto Root spawns early, but both watchdogs start only when the
          # payload-side uptime gate has actually been reached.
          path = 'app/src/main/java/dev/busung/s25uroot/ExploitRunControl.kt'
          helper = (
              '    fun payloadGateWatchdogStartUptimeMillis(\n'
              '        processStartedAtUptimeMillis: Long,\n'
              '        minimumUptimeSeconds: Int?,\n'
              '    ): Long {\n'
              '        val gateUptimeMillis = minimumUptimeSeconds\n'
              '            ?.let(DiagnosticUptime::normalize)\n'
              '            ?.times(1_000L)\n'
              '            ?: return processStartedAtUptimeMillis\n'
              '        return maxOf(processStartedAtUptimeMillis, gateUptimeMillis)\n'
              '    }\n\n'
          )
          insert_before(
              path,
              '    fun environment(request: ExploitEnvironmentRequest): Map<String, String> = linkedMapOf(\n',
              helper,
          )

          path = 'app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt'
          replace_once(
              path,
              '            val startedAt = SystemClock.elapsedRealtime()\n'
              '            var lastProgressAt = startedAt\n',
              '            val startedAt = SystemClock.elapsedRealtime()\n'
              '            val watchdogStartsAt = if (externalObserverMode) {\n'
              '                ExploitRunControl.payloadGateWatchdogStartUptimeMillis(\n'
              '                    processStartedAtUptimeMillis = startedAt,\n'
              '                    minimumUptimeSeconds = minimumUptimeSeconds,\n'
              '                )\n'
              '            } else {\n'
              '                startedAt\n'
              '            }\n'
              '            var lastProgressAt = watchdogStartsAt\n',
          )
          replace_once(
              path,
              '                    lastProgressAt = SystemClock.elapsedRealtime()\n',
              '                    lastProgressAt = maxOf(SystemClock.elapsedRealtime(), watchdogStartsAt)\n',
          )
          replace_once(
              path,
              '                require(now - lastProgressAt < EXPLOIT_STALL_MILLIS) {\n'
              '                    context.getString(R.string.error_exploit_stalled)\n'
              '                }\n'
              '                require(now - startedAt < EXPLOIT_TOTAL_MILLIS) {\n'
              '                    context.getString(R.string.error_exploit_timeout)\n'
              '                }\n',
              '                if (now >= watchdogStartsAt) {\n'
              '                    require(now - lastProgressAt < EXPLOIT_STALL_MILLIS) {\n'
              '                        context.getString(R.string.error_exploit_stalled)\n'
              '                    }\n'
              '                    require(now - watchdogStartsAt < EXPLOIT_TOTAL_MILLIS) {\n'
              '                        context.getString(R.string.error_exploit_timeout)\n'
              '                    }\n'
              '                }\n',
          )

          # 2. History viewing is read-only, so it cannot finalize a live Auto Root.
          # 3. Disk deletion and reload are serialized to prevent deleted rows returning.
          path = 'app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt'
          replace_once(
              path,
              '    private var historyJob: Job? = null\n',
              '    private var historyJob: Job? = null\n'
              '    private var historyMutationJob: Job? = null\n',
          )
          load_history = (
              '    fun loadHistory() {\n'
              '        if (installJob?.isActive == true) return\n'
              '        historyJob?.cancel()\n'
              '        val pendingMutation = historyMutationJob\n'
              '        historyJob = viewModelScope.launch(Dispatchers.IO) {\n'
              '            pendingMutation?.join()\n'
              '            val job = currentCoroutineContext()[Job]\n'
              '            val loaded = historyStore.load { job?.isActive != false }\n'
              '            currentCoroutineContext().ensureActive()\n'
              '            mutableHistory.value = loaded\n'
              '        }\n'
              '    }\n\n'
          )
          replace_region(
              path,
              '    fun loadHistory(',
              '    fun cancelHistoryLoad()',
              load_history,
          )
          delete_history = (
              '    fun deleteHistoryEntries(ids: Collection<String>) {\n'
              '        val runningId = activeHistoryEntry?.id\n'
              '        val toDelete = ids.filterNot { it == runningId }\n'
              '        if (toDelete.isEmpty()) return\n'
              '        historyJob?.cancel()\n'
              '        historyJob = null\n'
              '        mutableHistory.value = mutableHistory.value.filterNot { it.id in toDelete }\n'
              '        val previousMutation = historyMutationJob\n'
              '        historyMutationJob = viewModelScope.launch(Dispatchers.IO) {\n'
              '            previousMutation?.join()\n'
              '            toDelete.forEach(historyStore::delete)\n'
              '        }\n'
              '    }\n\n'
          )
          replace_region(
              path,
              '    fun deleteHistoryEntries(',
              '    fun loadTargetCatalog()',
              delete_history,
          )

          # 4. Preserve chronological pruning using the persisted start timestamp,
          # while still avoiding full decoding/observer normalization on each save.
          path = 'app/src/main/java/dev/busung/s25uroot/InstallHistory.kt'
          started_helper = (
              'internal fun historyStartedAtMillisFromPrefix(prefix: String): Long? {\n'
              '    val marker = "startedAtMillis"\n'
              '    val markerIndex = prefix.indexOf(marker)\n'
              '    if (markerIndex < 0) return null\n'
              '    val colonIndex = prefix.indexOf(\':\', markerIndex + marker.length)\n'
              '    if (colonIndex < 0) return null\n'
              '    var start = colonIndex + 1\n'
              '    while (start < prefix.length && prefix[start].isWhitespace()) start++\n'
              '    var end = start\n'
              '    while (end < prefix.length && prefix[end].isDigit()) end++\n'
              '    if (end == start) return null\n'
              '    return prefix.substring(start, end).toLongOrNull()\n'
              '}\n\n'
          )
          insert_before(path, 'internal const val HISTORY_SCHEMA_VERSION = 2\n', started_helper)
          prune_block = (
              '    private fun storedStartedAtMillis(file: File): Long? = runCatching {\n'
              '        file.inputStream().bufferedReader(Charsets.UTF_8).use { reader ->\n'
              '            val buffer = CharArray(HISTORY_ORDER_SCAN_CHARS)\n'
              '            val count = reader.read(buffer)\n'
              '            if (count <= 0) null else historyStartedAtMillisFromPrefix(String(buffer, 0, count))\n'
              '        }\n'
              '    }.getOrNull()\n\n'
              '    private fun pruneHistoryFiles() {\n'
              '        val files = directory.listFiles { file -> file.extension == "json" }.orEmpty()\n'
              '        if (files.size <= MAX_HISTORY_ENTRIES) return\n'
              '        files.sortedWith(\n'
              '            compareByDescending<File> { storedStartedAtMillis(it) ?: it.lastModified() }\n'
              '                .thenByDescending(File::getName),\n'
              '        ).drop(MAX_HISTORY_ENTRIES).forEach(File::delete)\n'
              '    }\n\n'
          )
          replace_region(path, '    private fun pruneHistoryFiles()', '    private fun encode(', prune_block)
          replace_once(
              path,
              '        private const val RUNNING_ENTRY_SCAN_CHARS = 2_048\n',
              '        private const val RUNNING_ENTRY_SCAN_CHARS = 2_048\n'
              '        private const val HISTORY_ORDER_SCAN_CHARS = 2_048\n',
          )

          # Regression tests for the new semantics.
          path = 'app/src/test/java/dev/busung/s25uroot/ExploitRunControlTest.kt'
          watchdog_test = (
              '    @Test\n'
              '    fun payloadGateWatchdogStartsAtGateAndKeepsFullExploitBudget() {\n'
              '        assertEquals(600_000L, ExploitRunControl.payloadGateWatchdogStartUptimeMillis(60_000L, 600))\n'
              '        assertEquals(700_000L, ExploitRunControl.payloadGateWatchdogStartUptimeMillis(700_000L, 600))\n'
              '        assertEquals(60_000L, ExploitRunControl.payloadGateWatchdogStartUptimeMillis(60_000L, null))\n'
              '    }\n\n'
          )
          insert_before(path, '    private fun request(mode: InvocationMode) = ExploitEnvironmentRequest(\n', watchdog_test)

          path = 'app/src/test/java/dev/busung/s25uroot/DiagnosticHistoryTest.kt'
          insert_before(path, 'import org.junit.Assert.assertTrue\n', 'import org.junit.Assert.assertNull\n')
          prune_test = (
              '    @Test\n'
              '    fun pruningReadsPersistedStartTimeInsteadOfFilesystemMtime() {\n'
              '        assertEquals(\n'
              '            123456L,\n'
              '            historyStartedAtMillisFromPrefix(\n'
              '                "{\\\"schemaVersion\\\":2,\\\"id\\\":\\\"x\\\",\\\"startedAtMillis\\\":123456,\\\"result\\\":\\\"Failed\\\"}",\n'
              '            ),\n'
              '        )\n'
              '        assertNull(historyStartedAtMillisFromPrefix("{\\\"id\\\":\\\"x\\\"}"))\n'
              '    }\n\n'
          )
          insert_before(
              path,
              '    @Test\n    fun recentObserverHistoryDoesNotNeedExpensiveRenormalization() {\n',
              prune_test,
          )

          # Structural assertions make the intended fixes explicit before Gradle runs.
          view = read('app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt')
          load_body = view.split('fun loadHistory()', 1)[1].split('fun cancelHistoryLoad()', 1)[0]
          assert 'recoverInterruptedRuns' not in load_body
          assert 'pendingMutation?.join()' in load_body
          assert 'previousMutation?.join()' in view
          runner = read('app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt')
          assert 'if (now >= watchdogStartsAt)' in runner
          assert 'now - watchdogStartsAt < EXPLOIT_TOTAL_MILLIS' in runner
          assert 'now - startedAt < EXPLOIT_TOTAL_MILLIS' not in runner
          history = read('app/src/main/java/dev/busung/s25uroot/InstallHistory.kt')
          assert 'storedStartedAtMillis(it) ?: it.lastModified()' in history
          PY

      - name: Prepare Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:compileReleaseKotlin \
            -PreleaseVersionCode=19999 \
            -PreleaseVersionName=0.3.999

      - name: Commit validated fixes directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Igor'
          git config user.email 'igorv88@gmail.com'
          git rm .github/workflows/tmp-fix-pr33-codex-review.yml
          git add \
            app/src/main/java/dev/busung/s25uroot/ExploitRunControl.kt \
            app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt \
            app/src/main/java/dev/busung/s25uroot/InstallHistory.kt \
            app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt \
            app/src/test/java/dev/busung/s25uroot/ExploitRunControlTest.kt \
            app/src/test/java/dev/busung/s25uroot/DiagnosticHistoryTest.kt
          git diff --cached --check
          git commit -m 'Fix PR33 Codex review regressions [skip actions]'
          git push origin HEAD:main
