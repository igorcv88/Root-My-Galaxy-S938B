name: Address observer review v2

on:
  push:
    branches:
      - feat/czg3-external-observer-v2

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.head_commit.message != 'Address observer review v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/czg3-external-observer-v2
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply review fixes
        run: python3 .github/scripts/address_observer_review_v2.py

      - name: Validate app
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          git diff --check

      - name: Commit validated source fixes
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git add app/src/main/java/dev/busung/s25uroot/ExploitObserver.kt
          git add app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          git add app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          git diff --cached --check
          git commit -m "Address observer review v2"
          git push origin HEAD:feat/czg3-external-observer-v2
