name: Validate CZG3 settings fix

on:
  push:
    branches:
      - fix/czg3-uptime-settings-independence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/czg3-uptime-settings-independence
          fetch-depth: 0
      - name: Verify settings separation
        shell: python
        run: |
          from pathlib import Path
          text = Path("app/src/main/java/dev/busung/s25uroot/MainActivity.kt").read_text()
          assert "if (advancedMode && showCzg3Diagnostics)" not in text
          diagnostic = text.index("if (showCzg3Diagnostics)")
          advanced = text.index("item { SectionLabel(stringResource(R.string.advanced)) }")
          assert diagnostic < advanced
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint and release assembly
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Remove temporary validation workflow
        if: success()
        run: |
          rm .github/workflows/validate-czg3-settings-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-czg3-settings-fix.yml
          git commit -m "Remove temporary CZG3 settings validation workflow"
          git push origin HEAD:fix/czg3-uptime-settings-independence
