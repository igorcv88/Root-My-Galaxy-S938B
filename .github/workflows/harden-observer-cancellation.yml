name: Harden observer cancellation

on:
  push:
    branches:
      - feat/czg3-external-observer-v2

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.event.head_commit.message != 'Harden observer cancellation semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/czg3-external-observer-v2
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply cancellation hardening
        run: python3 .github/scripts/harden_observer_cancellation.py

      - name: Validate app
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Commit validated hardening
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          rm -f .github/scripts/harden_observer_cancellation.py
          rm -f .github/workflows/harden-observer-cancellation.yml
          git add -A
          git diff --cached --check
          git commit -m "Harden observer cancellation semantics"
          git push origin HEAD:feat/czg3-external-observer-v2
