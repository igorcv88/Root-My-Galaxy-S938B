name: Finalize Auto Root performance fixes

on:
  push:
    branches:
      - fix/autoroot-standalone-scheduling-load
    paths:
      - .github/workflows/tmp-finalize-autoroot-perf.yml

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/autoroot-standalone-scheduling-load
          fetch-depth: 0

      - name: Apply final responsiveness fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # History files written since External Observer v2 are already
          # normalized at save time. Do not run the expensive regex parser again
          # every time History is opened. New files carry an explicit schema bit;
          # recent pre-schema v0.3.38+ files are also known-normalized.
          path = 'app/src/main/java/dev/busung/s25uroot/InstallHistory.kt'
          replace_once(path,
              'internal fun historyLogForStorage(log: String): String = log\n\nclass InstallHistoryStore',
              '''internal fun historyLogForStorage(log: String): String = log\n\ninternal const val HISTORY_SCHEMA_VERSION = 2\n\ninternal fun historyNeedsExternalNormalization(\n    schemaVersion: Int,\n    appVersion: String?,\n    profileId: String?,\n    hasExternalObserverLog: Boolean,\n): Boolean {\n    if (profileId != CZG3_PROFILE_ID_FOR_DIAGNOSTICS && !hasExternalObserverLog) return false\n    if (schemaVersion >= HISTORY_SCHEMA_VERSION) return false\n    val match = appVersion?.let { Regex("^(\\\\d+)\\\\.(\\\\d+)\\\\.(\\\\d+)").find(it) }\n        ?: return true\n    val (major, minor, patch) = match.destructured.toList().map(String::toInt)\n    return major == 0 && (minor < 3 || (minor == 3 && patch < 38))\n}\n\nclass InstallHistoryStore''')
          replace_once(path,
              '''    fun load(): List<InstallHistoryEntry> = directory.listFiles { file -> file.extension == "json" }.orEmpty()\n        .mapNotNull(::decodeOrQuarantine).sortedByDescending(InstallHistoryEntry::startedAtMillis)\n''',
              '''    fun load(shouldContinue: () -> Boolean = { true }): List<InstallHistoryEntry> {\n        val entries = ArrayList<InstallHistoryEntry>()\n        for (file in directory.listFiles { candidate -> candidate.extension == "json" }.orEmpty()) {\n            if (!shouldContinue()) break\n            decodeOrQuarantine(file)?.let(entries::add)\n        }\n        return entries.sortedByDescending(InstallHistoryEntry::startedAtMillis)\n    }\n''')
          replace_once(path,
              '''    fun create(bootId: String? = AutoRootSupport.currentBootToken(), snapshot: DeviceSnapshot = DeviceSnapshot.current()): InstallHistoryEntry = InstallHistoryEntry(\n        id = UUID.randomUUID().toString(), startedAtMillis = System.currentTimeMillis(), completedAtMillis = null,\n        result = InstallRunResult.Running, log = "", usedShizuku = AppPreferences.shizukuMode(context), bootId = bootId,\n''',
              '''    fun create(\n        bootId: String? = AutoRootSupport.currentBootToken(),\n        snapshot: DeviceSnapshot = DeviceSnapshot.current(),\n        usedShizuku: Boolean = AppPreferences.shizukuMode(context),\n    ): InstallHistoryEntry = InstallHistoryEntry(\n        id = UUID.randomUUID().toString(), startedAtMillis = System.currentTimeMillis(), completedAtMillis = null,\n        result = InstallRunResult.Running, log = "", usedShizuku = usedShizuku, bootId = bootId,\n''')
          replace_once(path,
              '''    private fun encode(entry: InstallHistoryEntry) = JSONObject()\n        .put("id", entry.id).put("startedAtMillis", entry.startedAtMillis).put("completedAtMillis", entry.completedAtMillis ?: JSONObject.NULL)\n''',
              '''    private fun encode(entry: InstallHistoryEntry) = JSONObject()\n        .put("schemaVersion", HISTORY_SCHEMA_VERSION)\n        .put("id", entry.id).put("startedAtMillis", entry.startedAtMillis).put("completedAtMillis", entry.completedAtMillis ?: JSONObject.NULL)\n''')
          replace_once(path,
              '''    private fun decode(bytes: ByteArray): InstallHistoryEntry {\n        val value = JSONObject(bytes.toString(Charsets.UTF_8)); val timings = value.optJSONArray("stageTimings")\n        return InstallHistoryEntry(\n''',
              '''    private fun decode(bytes: ByteArray): InstallHistoryEntry {\n        val value = JSONObject(bytes.toString(Charsets.UTF_8)); val timings = value.optJSONArray("stageTimings")\n        val schemaVersion = value.optInt("schemaVersion", 0)\n        val entry = InstallHistoryEntry(\n''')
          replace_once(path,
              '''            lastPrepCheckpoint = value.optionalString("lastPrepCheckpoint"),\n            lastPrepCheckpointUptimeMillis = value.optionalLong("lastPrepCheckpointUptimeMillis"),\n        ).let(::normalizeCzg3ExternalHistory)\n    }\n''',
              '''            lastPrepCheckpoint = value.optionalString("lastPrepCheckpoint"),\n            lastPrepCheckpointUptimeMillis = value.optionalLong("lastPrepCheckpointUptimeMillis"),\n        )\n        return if (\n            historyNeedsExternalNormalization(\n                schemaVersion = schemaVersion,\n                appVersion = entry.appVersion,\n                profileId = entry.profileId,\n                hasExternalObserverLog = entry.log.contains("RMG_OBSERVER_V2|"),\n            )\n        ) {\n            normalizeCzg3ExternalHistory(entry)\n        } else {\n            entry\n        }\n    }\n''')

          # Do not even start historical log parsing in the installer. History is
          # loaded on demand from the History tab only, and a pending load can be
          # cancelled before launching an exploit. Recovery still runs on IO at
          # the beginning of a new install.
          path = 'app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt'
          replace_once(path,
              '''    init {\n        refreshInternal(recoverInterrupted = true)\n    }\n\n    fun refresh() = refreshInternal(recoverInterrupted = false)\n\n    private fun refreshInternal(recoverInterrupted: Boolean) {\n        if (installJob?.isActive == true) return\n        historyJob?.cancel()\n        historyJob = viewModelScope.launch(Dispatchers.IO) {\n            mutableHistory.value = if (recoverInterrupted) {\n                historyStore.closeInterruptedRuns()\n            } else {\n                historyStore.load()\n            }\n        }\n        discoveryJob?.cancel()\n''',
              '''    init {\n        refresh()\n    }\n\n    fun refresh() {\n        if (installJob?.isActive == true) return\n        discoveryJob?.cancel()\n''')
          # close refresh() at the same existing location; only its opening changed.
          replace_once(path,
              '''    fun deleteHistoryEntries(ids: Collection<String>) {\n''',
              '''    fun loadHistory(recoverInterrupted: Boolean = true) {\n        if (installJob?.isActive == true) return\n        historyJob?.cancel()\n        historyJob = viewModelScope.launch(Dispatchers.IO) {\n            if (recoverInterrupted) historyStore.recoverInterruptedRuns()\n            val job = currentCoroutineContext()[Job]\n            val loaded = historyStore.load { job?.isActive != false }\n            currentCoroutineContext().ensureActive()\n            mutableHistory.value = loaded\n        }\n    }\n\n    fun cancelHistoryLoad() {\n        historyJob?.cancel()\n        historyJob = null\n    }\n\n    fun deleteHistoryEntries(ids: Collection<String>) {\n''')
          replace_once(path,
              '''    fun install(profileId: String? = null) {\n        if (installJob?.isActive == true || mutableState.value.phase == InstallPhase.Installed) return\n        discoveryJob?.cancel()\n''',
              '''    fun install(profileId: String? = null) {\n        if (installJob?.isActive == true || mutableState.value.phase == InstallPhase.Installed) return\n        discoveryJob?.cancel()\n        cancelHistoryLoad()\n''')
          replace_once(path,
              '''            mutableState.value = InstallUiState(\n                phase = InstallPhase.Checking,\n                probeOutput = mutableState.value.probeOutput,\n            )\n            startHistory()\n''',
              '''            mutableState.value = InstallUiState(\n                phase = InstallPhase.Checking,\n                probeOutput = mutableState.value.probeOutput,\n            )\n            historyStore.recoverInterruptedRuns()\n            startHistory()\n''')

          # Ensure Auto Root's very first persisted history record can never inherit
          # the user's manual Shizuku preference even transiently.
          path = 'app/src/main/java/dev/busung/s25uroot/AutoRootService.kt'
          replace_once(path,
              '''            historyEntry = historyStore.create().copy(\n''',
              '''            historyEntry = historyStore.create(usedShizuku = false).copy(\n''')

          # Heavy screen-to-screen AnimatedContent keeps both large trees alive
          # during transitions. History is now loaded only when requested, and
          # leaving the tab cancels any pending parse. Remove the two large content
          # transitions while leaving lightweight controls alone.
          path = 'app/src/main/java/dev/busung/s25uroot/MainActivity.kt'
          replace_once(path, 'import androidx.compose.animation.AnimatedContent\n', '')
          replace_once(path,
              '''                        onClick = {\n                            clickHaptic(view)\n                            selectedPage = page\n                        },\n''',
              '''                        onClick = {\n                            clickHaptic(view)\n                            if (page == AppPage.History) {\n                                installViewModel.loadHistory()\n                            } else if (selectedPage == AppPage.History) {\n                                installViewModel.cancelHistoryLoad()\n                            }\n                            selectedPage = page\n                        },\n''')
          replace_once(path,
              '''    ) { padding ->\n        AnimatedContent(targetState = selectedPage, label = "page") { page ->\n            when (page) {\n''',
              '''    ) { padding ->\n        when (selectedPage) {\n''')
          replace_once(path,
              '''                )\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun AppVersionText(\n''',
              '''                )\n            }\n    }\n}\n\n@Composable\nprivate fun AppVersionText(\n''')
          replace_once(path,
              '''    AnimatedContent(\n        targetState = selectedEntry,\n        contentKey = { it?.id ?: "history-list" },\n        label = "history-detail",\n    ) { entry ->\n        if (entry == null) {\n''',
              '''    if (selectedEntry == null) {\n''')
          replace_once(path,
              '''        } else {\n            HistoryDetail(\n                padding = padding,\n                entry = entry,\n                onBack = { selectedHistoryId = null },\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun HistoryList(\n''',
              '''    } else {\n        HistoryDetail(\n            padding = padding,\n            entry = selectedEntry,\n            onBack = { selectedHistoryId = null },\n        )\n    }\n}\n\n@Composable\nprivate fun HistoryList(\n''')

          # Regression tests for normalization fast-path behavior.
          path = 'app/src/test/java/dev/busung/s25uroot/DiagnosticHistoryTest.kt'
          replace_once(path,
              '''    @Test\n    fun aggregatesLatencyAttemptsAndCoarseUptimeBuckets() {\n''',
              '''    @Test\n    fun recentObserverHistoryDoesNotNeedExpensiveRenormalization() {\n        assertFalse(historyNeedsExternalNormalization(0, "0.3.38", CZG3_PROFILE_ID_FOR_DIAGNOSTICS, true))\n        assertFalse(historyNeedsExternalNormalization(HISTORY_SCHEMA_VERSION, null, CZG3_PROFILE_ID_FOR_DIAGNOSTICS, true))\n        assertTrue(historyNeedsExternalNormalization(0, "0.3.37", CZG3_PROFILE_ID_FOR_DIAGNOSTICS, true))\n        assertFalse(historyNeedsExternalNormalization(0, "0.3.37", "other-profile", false))\n    }\n\n    @Test\n    fun aggregatesLatencyAttemptsAndCoarseUptimeBuckets() {\n''')
          PY

      - name: Assert final invariants
        run: |
          set -euo pipefail
          grep -F 'historyStore.create(usedShizuku = false)' app/src/main/java/dev/busung/s25uroot/AutoRootService.kt
          grep -F 'fun loadHistory(recoverInterrupted: Boolean = true)' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -F 'cancelHistoryLoad()' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -F '.put("schemaVersion", HISTORY_SCHEMA_VERSION)' app/src/main/java/dev/busung/s25uroot/InstallHistory.kt
          grep -F 'historyNeedsExternalNormalization' app/src/main/java/dev/busung/s25uroot/InstallHistory.kt
          grep -F 'installViewModel.loadHistory()' app/src/main/java/dev/busung/s25uroot/MainActivity.kt
          ! grep -F 'AnimatedContent' app/src/main/java/dev/busung/s25uroot/MainActivity.kt
          ! grep -F 'refreshInternal' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt

      - name: Prepare Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test lint and assemble
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            -PreleaseVersionCode=10041 \
            -PreleaseVersionName=0.3.41

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'Igor'
          git config user.email 'igorv88@gmail.com'
          git add app/src/main app/src/test
          git commit -m 'Load diagnostic history on demand'
          git push origin HEAD:fix/autoroot-standalone-scheduling-load

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-finalize-autoroot-perf.yml
          git commit -m 'Remove final validation workflow [skip actions]'
          git push origin HEAD:fix/autoroot-standalone-scheduling-load
