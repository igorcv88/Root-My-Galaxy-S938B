name: Validate history and Auto Root fix

on:
  push:
    branches:
      - validate/history-autoroot-final-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint, and assemble
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            -PreleaseVersionCode=10042 \
            -PreleaseVersionName=0.3.42
