name: Verificar App PR

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/verify-pr.yml"

permissions:
  contents: read

concurrency:
  group: verify-app-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar cache do Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rodar testes e lint
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug
