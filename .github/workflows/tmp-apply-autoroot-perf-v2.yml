name: Retry Auto Root performance fixes

on:
  push:
    branches:
      - fix/autoroot-standalone-scheduling-load
    paths:
      - .github/workflows/tmp-apply-autoroot-perf-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/autoroot-standalone-scheduling-load
          fetch-depth: 0

      - name: Apply source fixes from validated patch script
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-apply-autoroot-perf.yml').read_text()
          start_marker = "          from pathlib import Path\n"
          end_marker = "          PY\n\n      - name: Assert performance"
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<autoroot-perf-patch>', 'exec'))

          strings = Path('app/src/main/res/values/strings.xml')
          text = strings.read_text()
          text = text.replace(
              '<string name="autoroot_battery_optimization_required">Disable battery optimization for Root My Galaxy to enable Auto Root.</string>',
              '<string name="autoroot_battery_optimization_required" translatable="false">Disable battery optimization for Root My Galaxy to enable Auto Root.</string>',
          )
          strings.write_text(text)
          PY

      - name: Assert performance and transport invariants
        run: |
          set -euo pipefail
          grep -F 'val useShizuku = false' app/src/main/java/dev/busung/s25uroot/AutoRootService.kt
          grep -F 'require(!useShizuku)' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          grep -F 'releaseImmediatelyForPayloadGate' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          grep -F 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' app/src/main/AndroidManifest.xml
          grep -F 'MutableStateFlow<List<InstallHistoryEntry>>(emptyList())' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          grep -F 'translatable="false"' app/src/main/res/values/strings.xml
          ! grep -F 'MutableStateFlow(historyStore.closeInterruptedRuns())' app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          ! grep -F 'val normalized = entries.map(::normalizeCzg3ExternalHistory)' app/src/main/java/dev/busung/s25uroot/InstallHistory.kt
          ! grep -F 'files.mapNotNull(::decodeOrQuarantine)' app/src/main/java/dev/busung/s25uroot/InstallHistory.kt
          ! grep -F 'LoadingIndicator' app/src/main/java/dev/busung/s25uroot/InstallActivity.kt
          ! grep -F 'AnimatedContent' app/src/main/java/dev/busung/s25uroot/InstallActivity.kt

      - name: Prepare Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test lint and assemble
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            -PreleaseVersionCode=10041 \
            -PreleaseVersionName=0.3.41

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'Igor'
          git config user.email 'igorv88@gmail.com'
          git add app/src/main app/src/test
          git commit -m 'Fix Auto Root scheduling and eliminate UI history ANRs'
          git push origin HEAD:fix/autoroot-standalone-scheduling-load

      - name: Remove temporary workflows
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-apply-autoroot-perf.yml .github/workflows/tmp-apply-autoroot-perf-v2.yml
          git commit -m 'Remove temporary validation workflows [skip actions]'
          git push origin HEAD:fix/autoroot-standalone-scheduling-load
