name: Address PR 37 review feedback

on:
  push:
    branches:
      - diag/czg3-fops-timestamps

permissions:
  contents: write

jobs:
  address-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply review fix and regression test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('app/src/main/java/dev/busung/s25uroot/Czg3ExternalTelemetry.kt')
          source = source_path.read_text(encoding='utf-8')
          if 'val stageTimingsWithInference = if (' not in source:
              old = '''    val timing = if (canRecordInferredTiming && inferredTimingElapsed != null) {
                  StageTiming(inferredStage, inferredTimingElapsed, attemptCount.takeIf { it > 0 })
              } else {
                  null
              }
              val stageTimingsBeforeInference = if (
                  timing?.stage == ExploitStage.AttemptingRace &&
                  summary.firstAttemptUptimeMillis != null
              ) {
                  normalizedStageTimings.filterNot { it.stage == ExploitStage.AttemptingRace }
              } else {
                  normalizedStageTimings
              }
          '''
              new = '''    val timing = if (canRecordInferredTiming && inferredTimingElapsed != null) {
                  val timingAttempt = if (
                      inferredStage == ExploitStage.AttemptingRace &&
                      summary.firstAttemptUptimeMillis != null
                  ) {
                      1
                  } else {
                      attemptCount.takeIf { it > 0 }
                  }
                  StageTiming(inferredStage, inferredTimingElapsed, timingAttempt)
              } else {
                  null
              }
              val stageTimingsWithInference = if (
                  timing?.stage == ExploitStage.AttemptingRace &&
                  summary.firstAttemptUptimeMillis != null
              ) {
                  val updated = normalizedStageTimings.toMutableList()
                  val firstAttemptIndex = updated.indexOfFirst {
                      it.stage == ExploitStage.AttemptingRace && it.attempt == 1
                  }
                  val raceTimingCount = updated.count { it.stage == ExploitStage.AttemptingRace }
                  val staleTerminalIndex = updated.lastIndex.takeIf { index ->
                      if (index < 0 || elapsed == null) {
                          false
                      } else {
                          val candidate = updated[index]
                          val matchesTerminalInference =
                              candidate.stage == ExploitStage.AttemptingRace &&
                                  candidate.elapsedMillis == elapsed &&
                                  candidate.attempt == attemptCount.takeIf { it > 0 }
                          val hasEarlierSameAttempt = (0 until index).any { priorIndex ->
                              val prior = updated[priorIndex]
                              prior.stage == ExploitStage.AttemptingRace &&
                                  prior.attempt == candidate.attempt
                          }
                          matchesTerminalInference &&
                              (raceTimingCount == 1 || hasEarlierSameAttempt)
                      }
                  }
                  when {
                      firstAttemptIndex >= 0 -> {
                          updated[firstAttemptIndex] = timing
                          if (staleTerminalIndex != null && staleTerminalIndex != firstAttemptIndex) {
                              updated.removeAt(staleTerminalIndex)
                          }
                          updated
                      }
                      staleTerminalIndex != null -> {
                          updated[staleTerminalIndex] = timing
                          updated
                      }
                      updated.lastOrNull() == timing -> updated
                      else -> {
                          val firstRaceIndex = updated.indexOfFirst {
                              it.stage == ExploitStage.AttemptingRace
                          }
                          if (firstRaceIndex >= 0) {
                              updated.add(firstRaceIndex, timing)
                          } else {
                              updated += timing
                          }
                          updated
                      }
                  }
              } else if (timing != null && normalizedStageTimings.lastOrNull() != timing) {
                  normalizedStageTimings + timing
              } else {
                  normalizedStageTimings
              }
          '''
              if old not in source:
                  raise SystemExit('Expected normalization block not found')
              source = source.replace(old, new, 1)
              old_return = '''        stageTimings = if (timing != null && stageTimingsBeforeInference.lastOrNull() != timing) {
                      stageTimingsBeforeInference + timing
                  } else {
                      stageTimingsBeforeInference
                  },
          '''
              new_return = '''        stageTimings = stageTimingsWithInference,
          '''
              if old_return not in source:
                  raise SystemExit('Expected stageTimings return block not found')
              source = source.replace(old_return, new_return, 1)
              source_path.write_text(source, encoding='utf-8')

          test_path = Path('app/src/test/java/dev/busung/s25uroot/Czg3ExternalStageTimingTest.kt')
          test = test_path.read_text(encoding='utf-8')
          if 'nativeAttemptAnchorPreservesSupervisorAttemptProgression' not in test:
              insertion = r'''
              @Test
              fun nativeAttemptAnchorPreservesSupervisorAttemptProgression() {
                  val log = """
                      RMG_BOOT_V1|configured_min_uptime_sec=120|payload_release_uptime_ms=120100|invocation_mode=auto_root
                      RMG_OBSERVER_V2|event=controller_start|available=true|transport=shizuku|scope=system_remote_markers
                      RMG_OBSERVER_V2|event=start|t_ms=120090|observer_pid=10
                      [+] exploit attempt=1/24 pid=200 delay=25000 p0_offset=scan
                      RMG_OBSERVER_V2|event=marker|t_ms=120125|name=attempt_begin|line=[+] exploit attempt=1/24 pid=200 delay=25000 p0_offset=scan
                      [+] exploit attempt=2/24 pid=201 delay=25000 p0_offset=scan
                      RMG_OBSERVER_V2|event=marker|t_ms=129600|name=attempt_begin|line=[+] exploit attempt=2/24 pid=201 delay=25000 p0_offset=scan
                      [*] app fops slide route parent=ffffff8000000000 target=ffffff802a64d7f0 effective_consume_usec=70000
                      RMG_OBSERVER_V2|event=marker|t_ms=140000|name=fops_page_held|line=[*] durable log checkpoint stage=fops-page-held
                      RMG_OBSERVER_V2|event=stop|t_ms=141000|dropped=0|bytes=1000
                  """.trimIndent()
                  val entry = InstallHistoryEntry(
                      id = "preserve-attempt-progression",
                      startedAtMillis = 1L,
                      completedAtMillis = 2L,
                      result = InstallRunResult.Failed,
                      log = log,
                      profileId = CZG3_PROFILE_ID_FOR_DIAGNOSTICS,
                      stage = ExploitStage.AttemptingRace,
                      attemptCount = 2,
                      exploitElapsedMillis = 20_900L,
                      stageTimings = listOf(
                          StageTiming(ExploitStage.AttemptingRace, 30L, 1),
                          StageTiming(ExploitStage.AttemptingRace, 9_500L, 2),
                          StageTiming(ExploitStage.AttemptingRace, 20_900L, 2),
                      ),
                  )

                  val normalized = normalizeCzg3ExternalHistory(entry)
                  val raceTimings = normalized.stageTimings.filter { it.stage == ExploitStage.AttemptingRace }

                  assertEquals(
                      listOf(
                          StageTiming(ExploitStage.AttemptingRace, 25L, 1),
                          StageTiming(ExploitStage.AttemptingRace, 9_500L, 2),
                      ),
                      raceTimings,
                  )
                  assertEquals(2, normalized.attemptCount)
              }
          '''
              close = test.rfind('\n}')
              if close < 0:
                  raise SystemExit('Test class closing brace not found')
              test = test[:close] + '\n' + insertion + test[close:]
              test_path.write_text(test, encoding='utf-8')
          PY
          git diff --check
      - name: Prepare Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Verify app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Commit review fix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No review fix changes to commit.'
            exit 0
          fi
          git config user.name 'Root My Galaxy'
          git config user.email 'root-my-galaxy@users.noreply.github.com'
          git add app/src/main/java/dev/busung/s25uroot/Czg3ExternalTelemetry.kt
          git add app/src/test/java/dev/busung/s25uroot/Czg3ExternalStageTimingTest.kt
          git commit -m 'fix: preserve CZG3 supervisor attempt timings'
          git push origin HEAD:diag/czg3-fops-timestamps
