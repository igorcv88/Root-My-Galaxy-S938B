name: Apply selected history export patch

on:
  push:
    branches:
      - feat/history-export-selected-logs

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/history-export-selected-logs
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply app patch
        run: |
          python3 .github/scripts/.tmp_apply_history_export.py
          git diff --check

      - name: Validate app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Commit validated feature
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git rm .github/workflows/.tmp-apply-history-export.yml
          git rm .github/scripts/.tmp_apply_history_export.py
          git add app/src/main/java/dev/busung/s25uroot/MainActivity.kt
          git add app/src/main/res/values/strings.xml
          git add app/src/main/res/values-pt-rBR/strings.xml
          git commit -m "Add export for selected history logs"
          git push origin HEAD:feat/history-export-selected-logs
