name: Apply CZG3 Auto Root diagnostics fix
on:
  push:
    branches: [fix/czg3-autoroot-diagnostics]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply focused corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f"missing patch anchor in {path}")
              p.write_text(s.replace(old,new,1))

          # 1) Exact CZG3 policy: selected uptime is the only post-ready timing gate.
          Path('app/src/main/java/dev/busung/s25uroot/Czg3AutoRootPolicy.kt').write_text('''package dev.busung.s25uroot\n\ninternal fun isExactCzg3DiagnosticTarget(device: DeviceSnapshot): Boolean =\n    device.manufacturer.equals("samsung", ignoreCase = true) &&\n        device.model == "SM-S938B" &&\n        device.device == "pa3q" &&\n        device.buildId == "BP4A.251205.006.S938BXXSBCZG3" &&\n        device.kernelRelease == "6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k"\n\ninternal fun shouldUseLegacyAutoRootStabilization(device: DeviceSnapshot): Boolean =\n    !isExactCzg3DiagnosticTarget(device)\n''')

          replace('app/src/main/java/dev/busung/s25uroot/AutoRootService.kt', '''            require(waitForAndroidReady()) { getString(R.string.autoroot_boot_timeout) }\n            updateNotification(getString(R.string.autoroot_stabilizing_android))\n            if (waitForStabilizationOrRoot(initialBootToken)) {\n                finishWithResult(getString(R.string.autoroot_root_restored))\n                return\n            }\n''', '''            require(waitForAndroidReady()) { getString(R.string.autoroot_boot_timeout) }\n            // CZG3 diagnostic runs use the explicit selected minimum uptime as the\n            // sole timing gate after Android readiness. Keeping the legacy 45 s\n            // stabilization here would make a requested 120 s launch occur at\n            // 120 s on some boots and ~148 s on others depending on BOOT_COMPLETED.\n            if (shouldUseLegacyAutoRootStabilization(DeviceSnapshot.current())) {\n                updateNotification(getString(R.string.autoroot_stabilizing_android))\n                if (waitForStabilizationOrRoot(initialBootToken)) {\n                    finishWithResult(getString(R.string.autoroot_root_restored))\n                    return\n                }\n            }\n''')

          # 2) Low-perturbation Android-side execution context, available to Manual and Auto Root.
          Path('app/src/main/java/dev/busung/s25uroot/AndroidRunContext.kt').write_text('''package dev.busung.s25uroot\n\nimport android.app.ActivityManager\nimport android.app.KeyguardManager\nimport android.content.Context\nimport android.content.Intent\nimport android.content.IntentFilter\nimport android.os.BatteryManager\nimport android.os.PowerManager\nimport android.os.Process\nimport android.os.SystemClock\nimport android.os.UserManager\nimport java.io.File\n\ninternal object AndroidRunContext {\n    private const val PREFERENCES = "race_diagnostic_context"\n    private const val BOOT_RECEIVER_UPTIME = "boot_receiver_uptime_ms"\n\n    fun recordBootReceiver(context: Context) {\n        context.getSharedPreferences(PREFERENCES, Context.MODE_PRIVATE).edit()\n            .putLong(BOOT_RECEIVER_UPTIME, SystemClock.elapsedRealtime()).apply()\n    }\n\n    fun snapshot(context: Context, event: String, observedUptimeMillis: Long = SystemClock.elapsedRealtime()): String {\n        val power = context.getSystemService(PowerManager::class.java)\n        val keyguard = context.getSystemService(KeyguardManager::class.java)\n        val user = context.getSystemService(UserManager::class.java)\n        val battery = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))\n        fun batteryInt(name: String) = battery?.getIntExtra(name, -1) ?: -1\n        val bootObserved = context.getSharedPreferences(PREFERENCES, Context.MODE_PRIVATE)\n            .getLong(BOOT_RECEIVER_UPTIME, -1)\n        val processState = ActivityManager.RunningAppProcessInfo().also(ActivityManager::getMyMemoryState)\n        val cgroup = readProc("/proc/self/cgroup")\n        val status = readProc("/proc/self/status")\n        val sched = readProc("/proc/self/sched")\n        val cpusAllowed = status.lineSequence().firstOrNull { it.startsWith("Cpus_allowed_list:") }\n            ?.substringAfter(':')?.trim().orEmpty().ifBlank { "unknown" }\n        fun schedValue(name: String): String = sched.lineSequence()\n            .firstOrNull { it.trimStart().startsWith(name) }\n            ?.substringAfter(':')?.trim().orEmpty().ifBlank { "unknown" }\n        val threadNice = runCatching { Process.getThreadPriority(Process.myTid()) }.getOrDefault(Int.MIN_VALUE)\n        return "RMG_ANDROID_V1|event=$event|uptime_ms=$observedUptimeMillis" +\n            "|boot_receiver_uptime_ms=$bootObserved|user_unlocked=${user.isUserUnlocked}" +\n            "|interactive=${power.isInteractive}|keyguard_locked=${keyguard.isKeyguardLocked}" +\n            "|thermal_status=${power.currentThermalStatus}" +\n            "|battery_level=${batteryInt(BatteryManager.EXTRA_LEVEL)}" +\n            "|battery_scale=${batteryInt(BatteryManager.EXTRA_SCALE)}" +\n            "|battery_status=${batteryInt(BatteryManager.EXTRA_STATUS)}" +\n            "|battery_plugged=${batteryInt(BatteryManager.EXTRA_PLUGGED)}" +\n            "|battery_temp_tenths_c=${batteryInt(BatteryManager.EXTRA_TEMPERATURE)}" +\n            "|process_importance=${processState.importance}" +\n            "|thread_nice=$threadNice|cpus_allowed_list=${sanitize(cpusAllowed)}" +\n            "|uclamp_min=${sanitize(schedValue("uclamp.min"))}" +\n            "|uclamp_max=${sanitize(schedValue("uclamp.max"))}" +\n            "|effective_uclamp_min=${sanitize(schedValue("effective uclamp.min"))}" +\n            "|effective_uclamp_max=${sanitize(schedValue("effective uclamp.max"))}" +\n            "|process_cgroup=${sanitize(cgroup)}"\n    }\n\n    private fun readProc(path: String): String = runCatching { File(path).readText() }.getOrDefault("")\n\n    private fun sanitize(value: String): String = value\n        .replace('\\r', ' ')\n        .replace('\\n', ';')\n        .replace('|', '/')\n        .trim()\n        .ifBlank { "unknown" }\n        .take(768)\n}\n''')

          # 3) Supervisor attempt count is authoritative across child-local attempt=1 telemetry.
          replace('app/src/main/java/dev/busung/s25uroot/ExploitDiagnostics.kt', '            attempt = event.attempt ?: attempt,', '            attempt = event.attempt?.let { maxOf(attempt ?: 0, it) } ?: attempt,')
          replace('app/src/main/java/dev/busung/s25uroot/ExploitDiagnostics.kt', '''class ExploitRunException(\n''', '''internal object SupervisorAttemptParser {\n    private val attemptPattern = Regex("\\\\bexploit attempt=(\\\\d+)/(\\\\d+)\\\\b")\n\n    fun maxAttempt(log: String): Int? = attemptPattern.findAll(log)\n        .mapNotNull { match ->\n            val attempt = match.groupValues[1].toIntOrNull() ?: return@mapNotNull null\n            val configured = match.groupValues[2].toIntOrNull() ?: return@mapNotNull null\n            attempt.takeIf { it in 1..configured }\n        }\n        .maxOrNull()\n}\n\ninternal fun ExploitDiagnosticSnapshot.withSupervisorAttempt(supervisorAttempt: Int?): ExploitDiagnosticSnapshot {\n    val resolved = supervisorAttempt ?: return this\n    if (resolved <= (attempt ?: 0)) return this\n    return copy(attempt = resolved)\n}\n\nclass ExploitRunException(\n''')

          # Manual runner: reconcile each diagnostic batch and final state with supervisor attempt lines.
          replace('app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt', '''                    parsed.first.forEach { event ->\n                        diagnosticSnapshot = applyDiagnosticEvent(diagnosticSnapshot, event, runId)\n                    }\n''', '''                    val supervisorAttempt = SupervisorAttemptParser.maxAttempt(rawLog)\n                    parsed.first.forEach { event ->\n                        diagnosticSnapshot = applyDiagnosticEvent(diagnosticSnapshot, event, runId, supervisorAttempt)\n                    }\n                    diagnosticSnapshot?.withSupervisorAttempt(supervisorAttempt)?.let { reconciled ->\n                        if (reconciled != diagnosticSnapshot) {\n                            diagnosticSnapshot = checkpointDiagnosticSnapshot(reconciled)\n                        }\n                    }\n''')
          replace('app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt', '''            parsed.first.forEach { event -> diagnosticSnapshot = applyDiagnosticEvent(diagnosticSnapshot, event, runId) }\n''', '''            val supervisorAttempt = SupervisorAttemptParser.maxAttempt(rawLog)\n            parsed.first.forEach { event ->\n                diagnosticSnapshot = applyDiagnosticEvent(diagnosticSnapshot, event, runId, supervisorAttempt)\n            }\n            diagnosticSnapshot?.withSupervisorAttempt(supervisorAttempt)?.let { reconciled ->\n                if (reconciled != diagnosticSnapshot) diagnosticSnapshot = checkpointDiagnosticSnapshot(reconciled)\n            }\n''')
          replace('app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt', '''        event: ExploitDiagnosticEvent,\n        runId: String,\n    ): ExploitDiagnosticSnapshot {\n        val updated = (current ?: ExploitDiagnosticSnapshot(runId)).apply(event)\n        mutableState.value = mutableState.value.copy(\n''', '''        event: ExploitDiagnosticEvent,\n        runId: String,\n        supervisorAttempt: Int?,\n    ): ExploitDiagnosticSnapshot {\n        val updated = (current ?: ExploitDiagnosticSnapshot(runId)).apply(event)\n            .withSupervisorAttempt(supervisorAttempt)\n        return checkpointDiagnosticSnapshot(updated)\n    }\n\n    private fun checkpointDiagnosticSnapshot(updated: ExploitDiagnosticSnapshot): ExploitDiagnosticSnapshot {\n        mutableState.value = mutableState.value.copy(\n''')

          # Auto Root runner: same reconciliation logic.
          replace('app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt', '''            consumedDiagnosticCharacters = parsed.second\n            parsed.first.forEach { event ->\n                val updated = (diagnosticSnapshot ?: ExploitDiagnosticSnapshot(runId)).apply(event)\n                diagnosticSnapshot = updated\n                onDiagnostic(updated)\n            }\n''', '''            consumedDiagnosticCharacters = parsed.second\n            val supervisorAttempt = SupervisorAttemptParser.maxAttempt(diagnosticLog)\n            parsed.first.forEach { event ->\n                val updated = (diagnosticSnapshot ?: ExploitDiagnosticSnapshot(runId)).apply(event)\n                    .withSupervisorAttempt(supervisorAttempt)\n                diagnosticSnapshot = updated\n                onDiagnostic(updated)\n            }\n            diagnosticSnapshot?.withSupervisorAttempt(supervisorAttempt)?.let { reconciled ->\n                if (reconciled != diagnosticSnapshot) {\n                    diagnosticSnapshot = reconciled\n                    onDiagnostic(reconciled)\n                }\n            }\n''')

          # Focused tests.
          p=Path('app/src/test/java/dev/busung/s25uroot/ExploitDiagnosticsTest.kt')
          s=p.read_text()
          anchor='''    @Test\n    fun terminalDecisionFailsClosedForMissingOrUnsafeOutcome() {\n'''
          tests='''    @Test\n    fun supervisorAttemptParserTracksRealSupervisorRetries() {\n        val log = """\n            [+] exploit attempt=1/24 pid=10 delay=25000\n            RMG_DIAG_V1|run=1111111111111111|ts_ns=1|elapsed_us=1|stage=PREPARATION|attempt=0|failure=SUCCESS|safety=UNSAFE_OR_UNKNOWN\n            [+] exploit attempt=7/24 pid=20 delay=35000\n            RMG_DIAG_V1|run=2222222222222222|ts_ns=2|elapsed_us=1|stage=PREPARATION|attempt=0|failure=SUCCESS|safety=UNSAFE_OR_UNKNOWN\n        """.trimIndent()\n        assertEquals(7, SupervisorAttemptParser.maxAttempt(log))\n    }\n\n    @Test\n    fun supervisorAttemptCannotBeRegressedByChildLocalAttempt() {\n        val snapshot = ExploitDiagnosticSnapshot("app-run-12345678", attempt = 7)\n            .apply(payloadEvent("1111111111111111", ExploitStage.AttemptingRace, 5_000_000_000L, attempt = 1))\n        assertEquals(7, snapshot.attempt)\n        assertEquals(9, snapshot.withSupervisorAttempt(9).attempt)\n    }\n\n'''
          if anchor not in s: raise SystemExit('missing ExploitDiagnosticsTest anchor')
          p.write_text(s.replace(anchor, tests+anchor,1))

          Path('app/src/test/java/dev/busung/s25uroot/Czg3AutoRootPolicyTest.kt').write_text('''package dev.busung.s25uroot\n\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass Czg3AutoRootPolicyTest {\n    private val exact = DeviceSnapshot(\n        manufacturer = "samsung", model = "SM-S938B", device = "pa3q",\n        kernelRelease = "6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k",\n        kernelVersionInfo = "#1", machine = "aarch64",\n        buildId = "BP4A.251205.006.S938BXXSBCZG3", fingerprint = "fingerprint",\n        androidRelease = "16", sdk = 36, abi = "arm64-v8a", pageSize = 4096,\n    )\n\n    @Test fun exactCzg3BypassesLegacyStabilization() {\n        assertTrue(isExactCzg3DiagnosticTarget(exact))\n        assertFalse(shouldUseLegacyAutoRootStabilization(exact))\n    }\n\n    @Test fun otherBuildKeepsLegacyStabilization() {\n        assertTrue(shouldUseLegacyAutoRootStabilization(exact.copy(buildId = "other")))\n    }\n}\n''')
          PY
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate focused fix
        run: |
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          grep -F 'shouldUseLegacyAutoRootStabilization(DeviceSnapshot.current())' app/src/main/java/dev/busung/s25uroot/AutoRootService.kt
          grep -F 'process_importance=' app/src/main/java/dev/busung/s25uroot/AndroidRunContext.kt
          grep -F 'SupervisorAttemptParser.maxAttempt' app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt
          git diff --exit-code -- src artifacts support || true
      - name: Commit correction and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-czg3-autoroot-diagnostics.yml
          git add app/src/main app/src/test
          git commit -m 'Fix CZG3 Auto Root diagnostic controls'
          git push origin HEAD:fix/czg3-autoroot-diagnostics
