name: Verify CZG3 timing branch

on:
  push:
    branches:
      - diag/czg3-fops-timestamps

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
