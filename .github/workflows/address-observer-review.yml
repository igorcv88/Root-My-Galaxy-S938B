name: Address external observer review

on:
  push:
    branches:
      - feat/czg3-external-observer-v2

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.head_commit.message != 'Address observer review feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/czg3-external-observer-v2
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply review fixes
        run: python3 .github/scripts/address_observer_review.py

      - name: Validate app
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Commit validated review fixes
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          rm -f .github/scripts/address_observer_review.py
          rm -f .github/workflows/address-observer-review.yml
          git add -A
          git diff --cached --check
          git commit -m "Address observer review feedback"
          git push origin HEAD:feat/czg3-external-observer-v2
