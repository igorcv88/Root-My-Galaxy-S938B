name: Verify application source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD_FILE=app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt
          UPDATER_FILE=app/src/main/java/dev/busung/s25uroot/AppUpdater.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          AUTOROOT='app/src/main/java/dev/busung/s25uroot/AutoRoot*.kt'

          grep -F \
            'private const val PAYLOAD_REPOSITORY = "igorcv88/Root-My-Galaxy-Payloads-S938B"' \
            "$PAYLOAD_FILE"

          ! grep -F \
            'BuSung-dev/Root-My-Galaxy-Payloads' \
            "$PAYLOAD_FILE"

          grep -F \
            'https://github.com/igorcv88/Root-My-Galaxy-S938B' \
            "$UPDATER_FILE"

          ! grep -F \
            'https://github.com/BuSung-dev/Root-My-Galaxy' \
            "$UPDATER_FILE"

          ! grep -R -n -E \
            'NeoZygisk|ReZygisk|ctl\.restart zygote|ksud soft-reboot' \
            README.md app/src/main

          grep -F \
            'android.intent.action.BOOT_COMPLETED' \
            "$MANIFEST"

          ! grep -R -n -E \
            'LOCKED_BOOT_COMPLETED|ctl\.restart zygote|ksud soft-reboot' \
            $AUTOROOT "$MANIFEST"

          ! grep -R -n -E \
            'https?://' \
            $AUTOROOT

          grep -F \
            'claimAttempt(this, bootToken)' \
            app/src/main/java/dev/busung/s25uroot/AutoRootService.kt

          grep -F \
            'loadVerifiedLocalPayloads(this)' \
            app/src/main/java/dev/busung/s25uroot/AutoRootService.kt

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Test, native build and lint
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:externalNativeBuildDebug \
            :app:testDebugUnitTest \
            :app:lintDebug
