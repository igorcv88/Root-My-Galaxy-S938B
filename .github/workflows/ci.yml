name: Verificar App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-app
  cancel-in-progress: true

env:
  PAYLOAD_REPOSITORY: igorcv88/Root-My-Galaxy-Payloads-S938B

jobs:
  verify:
    name: Verificar código e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Sincronizar perfil do Auto Root
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["PAYLOAD_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/ref/heads/main",
              headers={"User-Agent": "Root-My-Galaxy-CI"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              commit = json.load(response)["object"]["sha"]
          with urllib.request.urlopen(
              f"https://raw.githubusercontent.com/{repo}/{commit}/support/targets-v3.json",
              timeout=30,
          ) as response:
              manifest = json.load(response)

          if manifest.get("schemaVersion") != 3 or len(manifest.get("payloads", [])) != 1:
              raise SystemExit("Unexpected payload manifest")
          target = manifest["payloads"][0]
          if target.get("payloadId") != "pa3q-S938BXXSBCZG3":
              raise SystemExit("Unexpected Auto Root target")

          destination = pathlib.Path("app/src/main/res/raw/autoroot_target_v3.json")
          destination.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Auto Root profile synchronized from payload commit {commit}")
          PY

      - name: Verificar regras do app
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD_FILE=app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt
          UPDATER_FILE=app/src/main/java/dev/busung/s25uroot/AppUpdater.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          AUTOROOT='app/src/main/java/dev/busung/s25uroot/AutoRoot*.kt'

          grep -F \
            'private const val PAYLOAD_REPOSITORY = "igorcv88/Root-My-Galaxy-Payloads-S938B"' \
            "$PAYLOAD_FILE"
          ! grep -F 'BuSung-dev/Root-My-Galaxy-Payloads' "$PAYLOAD_FILE"
          grep -F 'https://github.com/igorcv88/Root-My-Galaxy-S938B' "$UPDATER_FILE"
          ! grep -F 'https://github.com/BuSung-dev/Root-My-Galaxy' "$UPDATER_FILE"
          grep -F 'android.intent.action.BOOT_COMPLETED' "$MANIFEST"
          ! grep -R -n -E 'LOCKED_BOOT_COMPLETED|ctl\.restart zygote|ksud soft-reboot' \
            $AUTOROOT "$MANIFEST"
          ! grep -R -n -E 'https?://' $AUTOROOT
          grep -F 'claimAttempt(this, bootToken)' \
            app/src/main/java/dev/busung/s25uroot/AutoRootService.kt
          grep -F 'loadVerifiedLocalPayloads(this)' \
            app/src/main/java/dev/busung/s25uroot/AutoRootService.kt

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar cache do Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rodar testes e lint
        run: |
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug
