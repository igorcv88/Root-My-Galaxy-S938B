name: Record signed release status

on:
  workflow_run:
    workflows: ["Build and publish signed APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record conclusion
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          cat > .github/release-status/root-my-galaxy.txt <<EOF
          conclusion=${{ github.event.workflow_run.conclusion }}
          run_id=${{ github.event.workflow_run.id }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          event=${{ github.event.workflow_run.event }}
          url=${{ github.event.workflow_run.html_url }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-status/root-my-galaxy.txt
          git commit -m "Record signed release result [skip ci]" || exit 0
          git push origin HEAD:main
