name: Apply current-boot ReZygisk migration patch

on:
  push:
    branches:
      - agent/rezygisk-late-load
    paths:
      - .github/patches/apply-current-boot

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rezygisk-late-load
          fetch-depth: 0
      - name: Apply current-boot migration
        run: |
          git apply --check .github/patches/two-stage-current-boot.patch
          git apply .github/patches/two-stage-current-boot.patch
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
          git commit -m "Recognize two-stage mode on an active KernelSU boot"
          git push origin HEAD:agent/rezygisk-late-load
