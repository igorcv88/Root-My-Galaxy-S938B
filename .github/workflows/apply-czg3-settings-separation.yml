name: Apply CZG3 settings separation

on:
  push:
    branches:
      - fix/czg3-uptime-settings-independence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/czg3-uptime-settings-independence
          fetch-depth: 0
      - name: Separate CZG3 uptime control from Advanced mode
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/dev/busung/s25uroot/MainActivity.kt")
          text = path.read_text()
          advanced_marker = '        item { SectionLabel(stringResource(R.string.advanced)) }\n'
          diagnostic_marker = '        if (advancedMode && showCzg3Diagnostics) {\n'
          about_marker = '        item { SectionLabel(stringResource(R.string.about)) }\n'

          advanced_start = text.index(advanced_marker)
          diagnostic_start = text.index(diagnostic_marker, advanced_start)
          about_start = text.index(about_marker, diagnostic_start)

          advanced_block = text[advanced_start:diagnostic_start]
          diagnostic_block = text[diagnostic_start:about_start].replace(
              diagnostic_marker,
              '        if (showCzg3Diagnostics) {\n',
              1,
          )
          replacement = diagnostic_block + advanced_block
          updated = text[:advanced_start] + replacement + text[about_start:]

          if updated == text:
              raise SystemExit("MainActivity.kt was not changed")
          if 'if (advancedMode && showCzg3Diagnostics)' in updated:
              raise SystemExit("CZG3 diagnostic control still depends on Advanced mode")
          if updated.index('if (showCzg3Diagnostics)') > updated.index(advanced_marker):
              raise SystemExit("CZG3 diagnostic control was not moved outside the Advanced section")

          path.write_text(updated)
      - name: Commit focused UI fix
        shell: bash
        run: |
          rm .github/workflows/apply-czg3-settings-separation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/busung/s25uroot/MainActivity.kt .github/workflows/apply-czg3-settings-separation.yml
          git commit -m "Separate CZG3 uptime setting from Advanced mode"
          git push origin HEAD:fix/czg3-uptime-settings-independence
