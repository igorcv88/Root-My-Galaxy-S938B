name: Apply external observer v2

on:
  push:
    branches:
      - feat/czg3-external-observer-v2

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'Integrate CZG3 external observer v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/czg3-external-observer-v2
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply observer integration
        run: |
          python3 .github/scripts/apply_observer_v2.py
          python3 .github/scripts/fix_observer_v2.py
          python3 .github/scripts/scope_observer_terminal.py
          python3 .github/scripts/defer_czg3_live_persistence.py

      - name: Validate app
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m "Integrate CZG3 external observer v2"
          git push origin HEAD:feat/czg3-external-observer-v2
