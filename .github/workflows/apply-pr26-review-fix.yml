name: Apply PR26 review fix

on:
  push:
    branches:
      - fix/czg3-autoroot-diagnostics
    paths:
      - .github/workflows/apply-pr26-review-fix.yml

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/czg3-autoroot-diagnostics
          fetch-depth: 0

      - name: Apply review correction
        run: python3 .github/scripts/apply_pr26_review_fix.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Commit review fix and remove temporary files
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-pr26-review-fix.yml .github/scripts/apply_pr26_review_fix.py
          git add app/src/main/java/dev/busung/s25uroot/ExploitDiagnostics.kt \
                  app/src/main/java/dev/busung/s25uroot/AutoRootRunner.kt \
                  app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt \
                  app/src/test/java/dev/busung/s25uroot/ExploitDiagnosticsTest.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Map supervisor attempts to diagnostics in log order"
          git push origin HEAD:fix/czg3-autoroot-diagnostics

# transient workflow; removed after successful validation
