name: Verify upstream boot hardening

on:
  push:
    branches:
      - integrate/upstream-boot-hardening
    paths:
      - app/**
      - gradle/**
      - gradlew
      - gradlew.bat
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/verify-upstream-boot-hardening.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-upstream-boot-hardening
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify diff formatting
        run: git diff --check origin/main...HEAD

      - name: Compile, test, and lint app
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            --stacktrace
