name: Validate observer review fixes v2

on:
  push:
    branches:
      - fix/czg3-observer-process-coverage

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/czg3-observer-process-coverage
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Reapply review fixes with corrected regression fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/validate-review-fixes.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = []
          for line in source[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_review_fixes.py').write_text('\n'.join(script) + '\n')
          PY
          python3 /tmp/apply_review_fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/dev/busung/s25uroot/Czg3ExternalTelemetryTest.kt')
          s = p.read_text()
          old = '.filterNot { it.contains("|pid=102|ppid=") }'
          new = '.filterNot { it.contains("|pid=102|starttime_ticks=1003|ppid=") }'
          if s.count(old) != 1:
              raise SystemExit(f'fixture filter matches={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'starttime_ticks=%llu' app/src/main/cpp/external_observer.c
          grep -Fq 'observer_seen_identities' app/src/main/cpp/external_observer.c
          grep -Fq 'sample.timeMillis >= expected.discoveredMillis' app/src/main/java/dev/busung/s25uroot/Czg3ExternalTelemetry.kt
          grep -Fq '.filterNot { it.contains("|pid=102|starttime_ticks=1003|ppid=") }' app/src/test/java/dev/busung/s25uroot/Czg3ExternalTelemetryTest.kt
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PreleaseVersionCode=10039 -PreleaseVersionName=0.3.39
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/external_observer.c app/src/main/java/dev/busung/s25uroot/Czg3ExternalTelemetry.kt app/src/test/java/dev/busung/s25uroot/Czg3ExternalTelemetryTest.kt
          git diff --cached --check
          git commit -m 'Bind observer coverage to process identity'
          git push origin HEAD:fix/czg3-observer-process-coverage
