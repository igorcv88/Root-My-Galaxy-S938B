name: Build and publish signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: root-my-galaxy-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYLOAD_REPOSITORY: igorcv88/Root-My-Galaxy-Payloads-S938B

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode and validate release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required Actions secret: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > release.keystore

          test -s release.keystore
          keytool -list \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Validate pinned payload feed
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["PAYLOAD_REPOSITORY"]
          commit_api = f"https://api.github.com/repos/{repo}/git/ref/heads/main"
          request = urllib.request.Request(
              commit_api,
              headers={"User-Agent": "Root-My-Galaxy-CI"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              commit = json.load(response)["object"]["sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit)

          raw = f"https://raw.githubusercontent.com/{repo}/{commit}"
          with urllib.request.urlopen(f"{raw}/support/targets-v3.json", timeout=30) as response:
              manifest = json.load(response)

          assert manifest["schemaVersion"] == 3
          payloads = manifest["payloads"]
          ids = [item["payloadId"] for item in payloads]
          assert len(ids) == len(set(ids))

          target = next(item for item in payloads if item["payloadId"] == "pa3q-S938BXXSBCZG3")
          assert target["models"] == ["SM-S938B"]
          assert target["kernelVersions"] == ["6.6.98"]
          assert target["exactMatch"] == {
              "manufacturer": "samsung",
              "model": "SM-S938B",
              "device": "pa3q",
              "buildDisplay": "BP4A.251205.006.S938BXXSBCZG3",
              "buildFingerprint": (
                  "samsung/pa3qxxx/pa3q:16/BP4A.251205.006/"
                  "S938BXXSBCZG3_OXMBCZG3:user/release-keys"
              ),
              "kernelRelease": "6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k",
              "kernelVersionInfo": "#1 SMP PREEMPT Thu Jul  2 00:48:56 UTC 2026",
              "machine": "aarch64",
              "sdk": 36,
              "abi": "arm64-v8a",
              "pageSize": 4096,
          }

          with open("app/src/main/res/raw/autoroot_target_v3.json", encoding="utf-8") as source:
              embedded = json.load(source)
          assert embedded["schemaVersion"] == 3
          assert embedded["payloads"] == [target], (
              "embedded Auto Root profile must exactly mirror the controlled CZG3 target"
          )

          mutable_prefix = f"https://raw.githubusercontent.com/{repo}/main/"
          for item in payloads:
              for artifact in (item["exploit"], item["kernelsu"]):
                  url = artifact["url"]
                  expected_size = artifact["size"]
                  expected_sha256 = artifact["sha256"].lower()
                  assert re.fullmatch(r"[0-9a-f]{64}", expected_sha256)
                  assert url.startswith(mutable_prefix), f"external payload URL: {url}"
                  relative = urllib.parse.unquote(url.removeprefix(mutable_prefix))
                  pinned_url = f"{raw}/{relative}"
                  digest = hashlib.sha256()
                  total = 0
                  with urllib.request.urlopen(pinned_url, timeout=90) as response:
                      while True:
                          block = response.read(1024 * 1024)
                          if not block:
                              break
                          digest.update(block)
                          total += len(block)
                  assert total == expected_size, (
                      f"payload size mismatch for {pinned_url}: {total} != {expected_size}"
                  )
                  assert digest.hexdigest() == expected_sha256, (
                      f"payload SHA-256 mismatch for {pinned_url}"
                  )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PAYLOAD_COMMIT={commit}\n")
          print(f"Validated {len(payloads)} profile(s) at payload commit {commit}")
          PY

      - name: Verify application payload endpoint
        run: |
          set -eu
          FILE=app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt
          grep -F 'private const val PAYLOAD_REPOSITORY = "igorcv88/Root-My-Galaxy-Payloads-S938B"' "$FILE"
          if grep -F 'BuSung-dev/Root-My-Galaxy-Payloads' "$FILE"; then
            echo "Application still references the upstream mutable feed" >&2
            exit 1
          fi

      - name: Verify Auto Root release boundaries
        run: |
          set -eu
          grep -F 'android.intent.action.BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          if grep -R -n -E 'LOCKED_BOOT_COMPLETED|ctl\.restart zygote|ksud soft-reboot' \
              app/src/main/java/dev/busung/s25uroot/AutoRoot*.kt app/src/main/AndroidManifest.xml; then
            echo "Auto Root crossed the post-boot or no-soft-reboot boundary" >&2
            exit 1
          fi
          if grep -R -n -E 'https?://' app/src/main/java/dev/busung/s25uroot/AutoRoot*.kt; then
            echo "Auto Root runtime must not depend on network URLs" >&2
            exit 1
          fi

      - name: Compute release version
        run: |
          set -eu
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.3.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME"

      - name: Align, sign, and verify APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required Actions secret: $name" >&2
              exit 1
            fi
          done

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"
          UNSIGNED_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED_APK=app/build/outputs/apk/release/app-release-aligned.apk
          RELEASE_ASSET="Root-My-Galaxy-${VERSION_NAME}.apk"

          test -f "$UNSIGNED_APK"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"

          "$BUILD_TOOLS_DIR/zipalign" \
            -P 16 \
            -f \
            -v \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RELEASE_ASSET" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$RELEASE_ASSET"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_ASSET"
          sha256sum "$RELEASE_ASSET" | tee "${RELEASE_ASSET}.sha256"
          echo "RELEASE_ASSET=$RELEASE_ASSET" >> "$GITHUB_ENV"

      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -eu
          cat > release-notes.md <<EOF
          Signed stable Root My Galaxy build.

          - Version: ${VERSION_NAME}
          - Version code: ${VERSION_CODE}
          - Source commit: ${GITHUB_SHA}
          - Payload repository: ${PAYLOAD_REPOSITORY}
          - Pinned payload commit validated during build: ${PAYLOAD_COMMIT}
          - Signing alias: ${KEY_ALIAS}

          The APK and SHA-256 are published directly as release assets. No GitHub Actions artifact wrapper is used.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" "${RELEASE_ASSET}.sha256" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Root My Galaxy ${VERSION_NAME}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "$RELEASE_ASSET" \
              "${RELEASE_ASSET}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Root My Galaxy ${VERSION_NAME}" \
              --notes-file release-notes.md \
              --latest
          fi
