name: Gerar APK Release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup-history:
    name: Limpar histórico de workflows antigos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Apagar execuções de outros workflows
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepPath = '.github/workflows/release.yml';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const foreign = runs.filter(run => run.path !== keepPath);
            const active = foreign.filter(run => run.status !== 'completed');
            const completed = foreign.filter(run => run.status === 'completed');

            core.info(`Total runs found: ${runs.length}`);
            core.info(`Preserving ${runs.length - foreign.length} run(s) from ${keepPath}`);
            core.info(`Deleting ${completed.length} completed run(s) from other workflows`);

            for (const run of completed) {
              core.info(`Deleting run ${run.id}: ${run.name} (${run.path})`);
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
            }

            if (active.length > 0) {
              core.setFailed(
                `There are ${active.length} non-release workflow run(s) still active; refusing to report complete cleanup.`
              );
            }
