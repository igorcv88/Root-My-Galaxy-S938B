name: Build and publish signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: root-my-galaxy-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_REPOSITORY: igorcv88/Root-My-Galaxy-Payloads-S938B
      RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required Actions secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          test -s "$RELEASE_STORE_FILE"
          keytool -list \
            -keystore "$RELEASE_STORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Validate pinned payload feed
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["PAYLOAD_REPOSITORY"]
          commit_api = f"https://api.github.com/repos/{repo}/git/ref/heads/main"
          request = urllib.request.Request(commit_api, headers={"User-Agent": "Root-My-Galaxy-CI"})
          with urllib.request.urlopen(request, timeout=30) as response:
              commit = json.load(response)["object"]["sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit)

          raw = f"https://raw.githubusercontent.com/{repo}/{commit}"
          with urllib.request.urlopen(f"{raw}/support/targets-v2.json", timeout=30) as response:
              manifest = json.load(response)

          assert manifest["schemaVersion"] == 2
          targets = manifest["targets"]
          ids = [target["profileId"] for target in targets]
          assert len(ids) == len(set(ids))

          target = next(item for item in targets if item["profileId"] == "pa3q-S938BXXSBCZG3")
          assert target["model"] == "SM-S938B"
          assert target["buildDisplay"] == "BP4A.251205.006.S938BXXSBCZG3"
          assert target["kernelRelease"] == "6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k"
          assert target["sdk"] == 36
          assert target["abi"] == "arm64-v8a"
          assert target["pageSize"] == 4096

          mutable_prefix = f"https://raw.githubusercontent.com/{repo}/main/"
          for item in targets:
              for artifact in (item["exploit"], item["kernelsu"]):
                  url = artifact["url"]
                  assert url.startswith(mutable_prefix), f"external payload URL: {url}"
                  pinned_url = f"{raw}/{url.removeprefix(mutable_prefix)}"
                  total = 0
                  with urllib.request.urlopen(pinned_url, timeout=90) as response:
                      while True:
                          block = response.read(1024 * 1024)
                          if not block:
                              break
                          total += len(block)
                  assert total == artifact["size"], (
                      f"payload size mismatch for {pinned_url}: {total} != {artifact['size']}"
                  )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PAYLOAD_COMMIT={commit}\n")
          print(f"Validated {len(targets)} profiles at payload commit {commit}")
          PY

      - name: Verify application payload endpoint
        run: |
          set -eu
          FILE=app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt
          grep -F 'private const val PAYLOAD_REPOSITORY = "igorcv88/Root-My-Galaxy-Payloads-S938B"' "$FILE"
          if grep -F 'BuSung-dev/Root-My-Galaxy-Payloads' "$FILE"; then
            echo "Application still references the upstream mutable feed" >&2
            exit 1
          fi

      - name: Compute release version
        run: |
          set -eu
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.3.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION_NAME}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME"

      - name: Verify signature and prepare release asset
        run: |
          set -eu
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          ASSET="Root-My-Galaxy-${VERSION_NAME}.apk"
          cp "$APK" "$ASSET"
          sha256sum "$ASSET" | tee "${ASSET}.sha256"
          echo "RELEASE_ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > release-notes.md <<EOF
          Signed stable Root My Galaxy build.

          - Version: ${VERSION_NAME}
          - Version code: ${VERSION_CODE}
          - Source commit: ${GITHUB_SHA}
          - Payload repository: ${PAYLOAD_REPOSITORY}
          - Pinned payload commit validated during build: ${PAYLOAD_COMMIT}
          - Signing alias: ${KEY_ALIAS}

          The APK is published directly as a release asset; no GitHub Actions artifact wrapper is used.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" "${RELEASE_ASSET}.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title "Root My Galaxy ${VERSION_NAME}" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" \
              "$RELEASE_ASSET" \
              "${RELEASE_ASSET}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Root My Galaxy ${VERSION_NAME}" \
              --notes-file release-notes.md \
              --latest
          fi
