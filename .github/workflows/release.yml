name: Gerar APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: root-my-galaxy-release
  cancel-in-progress: false

env:
  RELEASE_SERIES: "0.3"
  PAYLOAD_REPOSITORY: igorcv88/Root-My-Galaxy-Payloads-S938B

jobs:
  release:
    name: Gerar, assinar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confirmar branch main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Execute este workflow pela branch main." >&2
            exit 1
          fi

      - name: Escolher próxima versão
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          SERIES_PATTERN="${RELEASE_SERIES//./\.}"
          LAST_PATCH="$(
            git tag --list "v${RELEASE_SERIES}.*" \
              | sed -nE "s/^v${SERIES_PATTERN}\.([0-9]+)$/\1/p" \
              | sort -n \
              | tail -n 1
          )"
          LAST_PATCH="${LAST_PATCH:-0}"
          PATCH=$((LAST_PATCH + 1))
          VERSION_NAME="${RELEASE_SERIES}.${PATCH}"
          VERSION_CODE=$((10000 + PATCH))
          RELEASE_TAG="v${VERSION_NAME}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "A tag ${RELEASE_TAG} já existe." >&2
            exit 1
          fi

          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_ENV"

      - name: Sincronizar e verificar perfil CZG3 diagnóstico do Auto Root
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["PAYLOAD_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/ref/heads/main",
              headers={"User-Agent": "Root-My-Galaxy-Release"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              commit = json.load(response)["object"]["sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Invalid payload commit")

          raw = f"https://raw.githubusercontent.com/{repo}/{commit}"
          with urllib.request.urlopen(f"{raw}/support/targets-v3-diagnostic.json", timeout=30) as response:
              manifest = json.load(response)

          if manifest.get("schemaVersion") != 3:
              raise SystemExit("Unexpected payload manifest schema")
          matches = [
              item for item in manifest.get("payloads", [])
              if item.get("payloadId") == "pa3q-S938BXXSBCZG3-diagnostic"
          ]
          if len(matches) != 1:
              raise SystemExit("CZG3 diagnostic payload must exist exactly once")
          target = matches[0]
          expected_identity = {
              "manufacturer": "samsung",
              "model": "SM-S938B",
              "device": "pa3q",
              "buildDisplay": "BP4A.251205.006.S938BXXSBCZG3",
              "buildFingerprint": (
                  "samsung/pa3qxxx/pa3q:16/BP4A.251205.006/"
                  "S938BXXSBCZG3_OXMBCZG3:user/release-keys"
              ),
              "kernelRelease": "6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k",
              "kernelVersionInfo": "#1 SMP PREEMPT Thu Jul  2 00:48:56 UTC 2026",
              "machine": "aarch64",
              "sdk": 36,
              "abi": "arm64-v8a",
              "pageSize": 4096,
          }
          if target.get("exactMatch") != expected_identity:
              raise SystemExit("CZG3 identity changed unexpectedly")

          prefix = f"https://raw.githubusercontent.com/{repo}/main/"
          for artifact in (target["exploit"], target["kernelsu"]):
              url = artifact["url"]
              if not url.startswith(prefix):
                  raise SystemExit(f"Unexpected payload URL: {url}")
              relative = urllib.parse.unquote(url.removeprefix(prefix))
              digest = hashlib.sha256()
              total = 0
              with urllib.request.urlopen(f"{raw}/{relative}", timeout=90) as response:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      digest.update(block)
                      total += len(block)
              if total != artifact["size"]:
                  raise SystemExit(f"Payload size mismatch: {relative}")
              if digest.hexdigest() != artifact["sha256"].lower():
                  raise SystemExit(f"Payload SHA-256 mismatch: {relative}")

          # While the CZG3 race-diagnostic campaign is active, the normal APK
          # embeds the same exact diagnostic target used by manual installs.
          # This prevents the release workflow from silently reverting Auto Root
          # to the production payload after the app was built for diagnostics.
          embedded = {"schemaVersion": 3, "payloads": [target]}
          pathlib.Path("app/src/main/res/raw/autoroot_target_v3.json").write_text(
              json.dumps(embedded, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PAYLOAD_COMMIT={commit}\n")
          print(f"Diagnostic Auto Root fallback synchronized with payload commit {commit}")
          PY

      - name: Verificar regras do Auto Root
        run: |
          set -euo pipefail
          grep -F 'android.intent.action.BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          if grep -R -n -E 'LOCKED_BOOT_COMPLETED|ctl\.restart zygote|ksud soft-reboot' \
              app/src/main/java/dev/busung/s25uroot/AutoRoot*.kt app/src/main/AndroidManifest.xml; then
            echo "Auto Root contém uma operação não permitida no fluxo pós-boot." >&2
            exit 1
          fi
          if grep -R -n -E 'https?://' app/src/main/java/dev/busung/s25uroot/AutoRoot*.kt; then
            echo "Auto Root não deve depender de rede durante o boot." >&2
            exit 1
          fi

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar cache do Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Testar, validar e gerar APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret obrigatório ausente: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release.keystore
          chmod 600 release.keystore
          keytool -list \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Assinar e verificar APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret obrigatório ausente: $name" >&2
              exit 1
            fi
          done

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED_APK=app/build/outputs/apk/release/app-release-aligned.apk
          RELEASE_ASSET="Root-My-Galaxy-${VERSION_NAME}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -P 16 -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RELEASE_ASSET" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 4 "$RELEASE_ASSET"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_ASSET"

          BADGING="$($BUILD_TOOLS_DIR/aapt dump badging "$RELEASE_ASSET" | head -n 1)"
          grep -F "package: name='dev.busung.s25uroot'" <<< "$BADGING"
          grep -F "versionCode='${VERSION_CODE}'" <<< "$BADGING"
          grep -F "versionName='${VERSION_NAME}'" <<< "$BADGING"

          sha256sum "$RELEASE_ASSET" | tee "${RELEASE_ASSET}.sha256"
          echo "RELEASE_ASSET=$RELEASE_ASSET" >> "$GITHUB_ENV"

      - name: Gerar changelog detalhado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_TAG="$(git tag --sort=-version:refname --list "v${RELEASE_SERIES}.*" | head -n 1)"
          SHA256="$(awk '{print $1}' "${RELEASE_ASSET}.sha256")"
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          export BASE_TAG
          export HEAD_SHA="$GITHUB_SHA"
          export VERSION_NAME
          export SHA256
          export PRODUCT_NAME="Root My Galaxy"
          export BASE_BRANCH="main"
          export NOTES_PATH
          python3 .github/scripts/build_release_notes.py
          test -s "$NOTES_PATH"
          echo "NOTES_PATH=$NOTES_PATH" >> "$GITHUB_ENV"

      - name: Publicar release com changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ASSET" \
            "${RELEASE_ASSET}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Root My Galaxy ${VERSION_NAME}" \
            --notes-file "$NOTES_PATH" \
            --latest

      - name: Apagar chave temporária
        if: always()
        run: rm -f release.keystore
