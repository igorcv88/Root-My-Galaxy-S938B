name: Validate observer proc stat parser v2

on:
  push:
    branches:
      - fix/czg3-observer-process-coverage

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/czg3-observer-process-coverage
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Make proc stat field traversal type-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p = Path('app/src/main/cpp/external_observer.c')
          s = p.read_text()
          start_marker = 'static int parse_proc_stat(pid_t pid, struct proc_sample *sample) {'
          end_marker = '\nstatic int pid_in_list('
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          new = textwrap.dedent(r'''
          static int parse_proc_stat(pid_t pid, struct proc_sample *sample) {
            char path[128], text[4096];
            sample->processor = -1;
            sample->processor_ok = 0;
            snprintf(path, sizeof(path), "/proc/%d/stat", pid);
            if (read_text(path, text, sizeof(text)) <= 0) return 0;
            char *lparen = strchr(text, '('), *rparen = strrchr(text, ')');
            if (!lparen || !rparen || rparen <= lparen) return 0;
            size_t comm_len = (size_t)(rparen - lparen - 1);
            if (comm_len >= sizeof(sample->comm)) comm_len = sizeof(sample->comm) - 1;
            memcpy(sample->comm, lparen + 1, comm_len); sample->comm[comm_len] = '\0';
            sanitize_inline(sample->comm);
            char *p = rparen + 2;
            if (!*p) return 0;
            sample->state = *p;
            p += 2;
            int field = 4;
            while (*p && field <= 39) {
              while (*p == ' ') p++;
              if (!*p) break;
              char *token_end = p;
              while (*token_end && *token_end != ' ') token_end++;
              char *parsed_end = NULL;
              errno = 0;
              if (field == 4 || field == 20 || field == 39) {
                long long value = strtoll(p, &parsed_end, 10);
                int parsed = errno == 0 && parsed_end == token_end;
                if (!parsed && field <= 20) return 0;
                if (parsed && field == 4) sample->ppid = (pid_t)value;
                if (parsed && field == 20) sample->threads = (long)value;
                if (parsed && field == 39) {
                  sample->processor = (long)value;
                  sample->processor_ok = value >= 0;
                }
              } else if (field == 14 || field == 15) {
                unsigned long long value = strtoull(p, &parsed_end, 10);
                if (errno != 0 || parsed_end != token_end) return 0;
                if (field == 14) sample->utime = value;
                else sample->stime = value;
              }
              p = token_end;
              field++;
            }
            snprintf(path, sizeof(path), "/proc/%d/schedstat", pid);
            char schedstat[256];
            if (read_text(path, schedstat, sizeof(schedstat)) > 0 &&
                sscanf(schedstat, "%llu %llu %llu", &sample->runtime_ns, &sample->wait_ns, &sample->slices) == 3)
              sample->schedstat_ok = 1;
            return field > 20;
          }
          ''').lstrip()
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --build-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PreleaseVersionCode=10039 -PreleaseVersionName=0.3.39
      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/external_observer.c
          git diff --cached --check
          git commit -m 'Parse observer CPU field without signed overflow'
          git push origin HEAD:fix/czg3-observer-process-coverage
