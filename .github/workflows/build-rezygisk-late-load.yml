name: Build ReZygisk late-load

on:
  push:
    branches:
      - agent/rezygisk-late-load
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rezygisk-late-load
      - name: Apply queued source patch
        id: apply_patch
        if: ${{ hashFiles('scripts/rezygisk-toggle.patch.gz.b64') != '' }}
        run: |
          base64 -d scripts/rezygisk-toggle.patch.gz.b64 | gzip -d > /tmp/rezygisk-toggle.patch
          git apply --check /tmp/rezygisk-toggle.patch
          git apply /tmp/rezygisk-toggle.patch
          rm scripts/rezygisk-toggle.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main scripts/rezygisk-toggle.patch.gz.b64
          git commit -m "Add explicit ReZygisk exploit mode"
          git push origin HEAD:agent/rezygisk-late-load
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Export editable sources
        if: ${{ steps.apply_patch.outputs.applied != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-editable-sources
          path: |
            app/src/main/AndroidManifest.xml
            app/src/main/assets/rezygisk-late-load.sh
            app/src/main/java/dev/busung/s25uroot/AppPreferences.kt
            app/src/main/java/dev/busung/s25uroot/InstallActivity.kt
            app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
            app/src/main/java/dev/busung/s25uroot/MainActivity.kt
            app/src/main/java/dev/busung/s25uroot/ReZygiskBootstrapProvider.kt
            app/src/main/res/values/strings.xml
      - uses: actions/setup-java@v4
        if: ${{ steps.apply_patch.outputs.applied != 'true' }}
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        if: ${{ steps.apply_patch.outputs.applied != 'true' }}
      - name: Update Android command-line tools
        if: ${{ steps.apply_patch.outputs.applied != 'true' }}
        run: |
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/commandlinetools.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools.zip" | sha256sum -c -
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" /tmp/android-command-line-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest" /tmp/android-command-line-tools
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-command-line-tools
          mv /tmp/android-command-line-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        if: ${{ steps.apply_patch.outputs.applied != 'true' }}
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "cmake;3.22.1"
      - name: Build debug APK
        if: ${{ steps.apply_patch.outputs.applied != 'true' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: ${{ steps.apply_patch.outputs.applied != 'true' }}
        with:
          name: root-my-galaxy-rezygisk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
