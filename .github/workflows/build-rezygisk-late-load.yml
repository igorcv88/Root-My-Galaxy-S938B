name: Build ReZygisk late-load

on:
  push:
    branches:
      - agent/rezygisk-late-load
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rezygisk-late-load
          fetch-depth: 1
      - name: Export current Git object IDs
        run: |
          git rev-parse HEAD > commit-sha.txt
          git rev-parse 'HEAD^{tree}' > tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-git-object-ids
          path: |
            commit-sha.txt
            tree-sha.txt
