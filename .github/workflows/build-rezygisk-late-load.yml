name: Build ReZygisk late-load

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export editable sources
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-editable-sources
          path: |
            app/src/main/AndroidManifest.xml
            app/src/main/java/dev/busung/s25uroot/AppPreferences.kt
            app/src/main/java/dev/busung/s25uroot/InstallActivity.kt
            app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt
            app/src/main/java/dev/busung/s25uroot/MainActivity.kt
            app/src/main/java/dev/busung/s25uroot/ReZygiskLateLoad.kt
            app/src/main/res/values/strings.xml
            bridge
      - name: Validate bridge shell
        run: |
          sh -n bridge/late-load.sh
          sh -n bridge/service.sh
          sh -n bridge/bridge.sh
          sh -n bridge/uninstall.sh
      - name: Package bridge module
        run: |
          chmod 755 bridge/late-load.sh bridge/service.sh bridge/bridge.sh bridge/uninstall.sh
          rm -f Root-My-Galaxy-ReZygisk-Bridge.zip
          (cd bridge && zip -9 -r ../Root-My-Galaxy-ReZygisk-Bridge.zip module.prop late-load.sh service.sh bridge.sh uninstall.sh README.md)
          unzip -t Root-My-Galaxy-ReZygisk-Bridge.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Update Android command-line tools
        run: |
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/commandlinetools.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/commandlinetools.zip" | sha256sum -c -
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" /tmp/android-command-line-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest" /tmp/android-command-line-tools
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-command-line-tools
          mv /tmp/android-command-line-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-rezygisk-bridge-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            Root-My-Galaxy-ReZygisk-Bridge.zip
          if-no-files-found: error
